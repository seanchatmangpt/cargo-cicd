name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel superseded runs on the same ref so pushes don't pile up runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Format (instant, runs in parallel) ──────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin rustfmt for reproducible formatting: a new stable rustfmt release
      # should never spontaneously turn this gate red. Bump deliberately.
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt
      - run: cargo fmt --check

  # ── Check + all tests in one job (single compile, shared cache) ─────────────
  check-and-test:
    name: Check + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin the toolchain so `clippy -- -D warnings` is deterministic: a new
      # stable Rust release adds lints that would otherwise turn this gate red
      # with no code change. Bump deliberately (keep in sync with the fmt job).
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Tests (default features)
        run: cargo test

      - name: Tests (process-data)
        run: cargo test --features process-data

      - name: Tests (autonomic)
        run: cargo test --features autonomic

      - name: Tests (lsp)
        run: cargo test --features lsp

      - name: Tests (affidavit)
        run: cargo test --features affidavit

      - name: Feature projection
        run: cargo test --features process-data --test feature_projection

      - name: Autonomic policies
        run: cargo test --features autonomic --test autonomic_policies

      - name: Invariants
        run: cargo test --test invariants -- --nocapture

      - name: ggen customization guard
        run: cargo test --test ggen_customization_guard -- --nocapture

      - name: ggen pipeline smoke (workspace sync)
        run: cargo run -- workspace sync
        continue-on-error: true

  # ── Evidence gate (non-blocking, runs after tests) ──────────────────────────
  evidence-gate:
    name: Evidence Gate (wasm4pm)
    runs-on: ubuntu-latest
    needs: check-and-test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check wpm oracle availability
        id: wpm-check
        run: |
          if command -v wpm >/dev/null 2>&1; then
            echo "wpm_available=true" >> "$GITHUB_OUTPUT"
            wpm --version || true
          else
            echo "wpm_available=false" >> "$GITHUB_OUTPUT"
            echo "wpm not found — evidence gate tests use Blocked fallback"
          fi

      - name: Evidence gate — happy path
        run: cargo test --test wasm4pm_evidence_gate --features wasm4pm -- --nocapture
        env:
          REQUIRE_WPM_ORACLE: ${{ secrets.REQUIRE_WPM_ORACLE || '' }}

      - name: Evidence gate — mutation
        run: cargo test --test wasm4pm_evidence_mutation --features wasm4pm -- --nocapture

      - name: Evidence gate — refusal cases
        run: cargo test --test wasm4pm_refusal_cases --features wasm4pm -- --nocapture

      - name: List emitted evidence artifacts
        if: always()
        run: ls -la target/cargo-cicd/evidence/ 2>/dev/null || echo "No evidence directory"

      - name: Audit with wpm (if available)
        if: steps.wpm-check.outputs.wpm_available == 'true'
        run: |
          for f in $(find target/cargo-cicd/evidence/ -name "*.xes" 2>/dev/null); do
            echo "Auditing: $f"
            wpm audit "$f" || true
          done

  # ── Affidavit gate (non-blocking, runs after tests) ─────────────────────────
  affidavit-gate:
    name: Affidavit Gate (seal/verify)
    runs-on: ubuntu-latest
    needs: [check-and-test]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.94.1

      - uses: Swatinem/rust-cache@v2

      - name: Build cargo-cicd with affidavit feature
        run: cargo build --features affidavit

      - name: Seal evidence receipt
        run: cargo run --features affidavit -- affidavit seal || true

      - name: Verify sealed receipt
        run: cargo run --features affidavit -- affidavit verify || true
