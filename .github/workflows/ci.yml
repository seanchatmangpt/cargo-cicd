name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check (lint + type-check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache ~/.cargo registry and index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-check-
            ${{ runner.os }}-target-

      - name: Install cargo-make
        run: cargo install cargo-make --locked

      - name: Run cargo make check
        run: cargo make check

  test-unit:
    name: Unit & Smoke Tests (Tier 1)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache ~/.cargo registry and index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-test-unit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-test-unit-
            ${{ runner.os }}-target-

      - name: Install cargo-make
        run: cargo install cargo-make --locked

      - name: Run all Tier 1 tests
        run: cargo make test

  test-features:
    name: Feature Flag Compilation
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache ~/.cargo registry and index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-features-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-features-
            ${{ runner.os }}-target-

      - name: Build with autonomic, wasm4pm, and contrib features
        run: cargo build --features autonomic,wasm4pm,contrib

      - name: Test with process-data feature
        run: cargo test --features process-data

      - name: Test with autonomic feature
        run: cargo test --features autonomic

      - name: Test feature projection consistency
        run: cargo test --features process-data --test feature_projection

      - name: Test autonomic policies with feature enabled
        run: cargo test --features autonomic --test autonomic_policies

  test-invariants:
    name: Non-Negotiable Invariants
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache ~/.cargo registry and index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-invariants-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-invariants-
            ${{ runner.os }}-target-

      - name: Run invariant tests
        run: cargo test --test invariants -- --nocapture

  evidence-gate:
    name: Evidence Gate (wasm4pm adjudication)
    runs-on: ubuntu-latest
    needs: test-unit
    # The wpm oracle binary is not installed in standard CI environments.
    # Tests fall back to ExpectedWpmVerdict::Blocked gracefully when wpm is absent.
    # Set REQUIRE_WPM_ORACLE=1 in CI secrets to force oracle presence for release gates.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache ~/.cargo registry and index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-evidence-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-evidence-
            ${{ runner.os }}-target-

      - name: Check wpm oracle availability
        id: wpm-check
        run: |
          if command -v wpm >/dev/null 2>&1; then
            echo "wpm_available=true" >> "$GITHUB_OUTPUT"
            echo "wpm found at: $(which wpm)"
            wpm --version || true
          else
            echo "wpm_available=false" >> "$GITHUB_OUTPUT"
            echo "wpm oracle not found on PATH — evidence gate tests will use Blocked fallback"
          fi

      - name: Run evidence gate — happy path
        run: cargo test --test wasm4pm_evidence_gate --features wasm4pm -- --nocapture
        env:
          REQUIRE_WPM_ORACLE: ${{ secrets.REQUIRE_WPM_ORACLE || '' }}

      - name: Run evidence gate — mutation (negative cases)
        run: cargo test --test wasm4pm_evidence_mutation --features wasm4pm -- --nocapture

      - name: Run evidence gate — refusal cases
        run: cargo test --test wasm4pm_refusal_cases --features wasm4pm -- --nocapture

      - name: List emitted evidence artifacts
        if: always()
        run: |
          echo "--- Evidence artifacts in target/cargo-cicd/evidence/ ---"
          ls -la target/cargo-cicd/evidence/ 2>/dev/null || echo "No evidence directory found"

      - name: Audit evidence with wpm oracle (if available)
        if: steps.wpm-check.outputs.wpm_available == 'true'
        run: |
          XES_FILES=$(find target/cargo-cicd/evidence/ -name "*.xes" 2>/dev/null)
          if [ -z "$XES_FILES" ]; then
            echo "No XES evidence files found to audit"
          else
            for f in $XES_FILES; do
              echo "Auditing: $f"
              wpm audit "$f" || true
            done
          fi
