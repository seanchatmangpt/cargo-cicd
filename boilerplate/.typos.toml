[default]
extend-ignore-re = [
    "\\b[0-9a-f]{40}\\b",                                                    # git SHAs
    "\\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\\b",  # UUIDs
]

[files]
extend-exclude = [
    "target/",
    "*.lock",
    "*.snap",
    "tests/fixtures/",
    "fuzz/corpus/",
]

[default.extend-words]
# Project-specific terms that typos incorrectly flags
"cicd"  = "cicd"
"nouns" = "nouns"
"ggen"  = "ggen"
