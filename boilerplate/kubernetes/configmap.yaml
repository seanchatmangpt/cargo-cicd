---
# =============================================================================
# kubernetes/configmap.yaml
# Non-secret runtime configuration for cargo-project-serve.
# Secrets (DATABASE_URL passwords, API keys, etc.) belong in a Secret resource
# or an external secrets manager — never in a ConfigMap.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: cargo-project-config
  namespace: default
  labels:
    app.kubernetes.io/name: cargo-project-serve
    app.kubernetes.io/component: config
    app.kubernetes.io/managed-by: kubectl
data:
  # ---------------------------------------------------------------------------
  # Runtime behaviour
  # ---------------------------------------------------------------------------
  RUST_LOG: "info"
  APP_ENV: "production"

  # Bind address inside the container
  APP_HOST: "0.0.0.0"
  APP_PORT: "8080"

  # ---------------------------------------------------------------------------
  # Health check paths (must match the probes in deployment.yaml)
  # ---------------------------------------------------------------------------
  HEALTH_LIVE_PATH: "/health/live"
  HEALTH_READY_PATH: "/health/ready"

  # ---------------------------------------------------------------------------
  # Database (non-secret parts — connection string lives in a Secret)
  # ---------------------------------------------------------------------------
  DB_MAX_CONNECTIONS: "10"
  DB_MIN_CONNECTIONS: "1"
  DB_CONNECT_TIMEOUT_SECS: "30"
  DB_IDLE_TIMEOUT_SECS: "600"

  # ---------------------------------------------------------------------------
  # Observability
  # ---------------------------------------------------------------------------
  OTEL_SERVICE_NAME: "cargo-project-serve"
  OTEL_SERVICE_VERSION: "0.1.0"
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "0.1"

  # ---------------------------------------------------------------------------
  # Application-specific tuning
  # ---------------------------------------------------------------------------
  # Maximum request body size (bytes)
  MAX_BODY_SIZE_BYTES: "1048576"

  # Request timeout (seconds)
  REQUEST_TIMEOUT_SECS: "30"

  # Enable structured JSON logging
  LOG_FORMAT: "json"
