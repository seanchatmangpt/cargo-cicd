---
# =============================================================================
# kubernetes/deployment.yaml
# Kubernetes manifests for cargo-project-serve.
# Includes: Deployment, Service, HorizontalPodAutoscaler
# Apply with: kubectl apply -f kubernetes/
# =============================================================================

# ---------------------------------------------------------------------------
# Deployment
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargo-project-serve
  namespace: default
  labels:
    app.kubernetes.io/name: cargo-project-serve
    app.kubernetes.io/component: server
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: kubectl
  annotations:
    # Record the last applied configuration for kubectl diff
    kubectl.kubernetes.io/last-applied-configuration: ""
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cargo-project-serve
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Allow one extra pod during rollout; never go below desired replicas
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cargo-project-serve
        app.kubernetes.io/component: server
        app.kubernetes.io/version: "0.1.0"
      annotations:
        # Force pod restart when the ConfigMap changes
        checksum/config: ""   # fill with: sha256sum of configmap.yaml in CI
    spec:
      # -----------------------------------------------------------------------
      # Security context — run as non-root (matches distroless nobody uid)
      # -----------------------------------------------------------------------
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532      # distroless 'nobody'
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      # -----------------------------------------------------------------------
      # Topology spread — distribute pods across nodes and availability zones
      # -----------------------------------------------------------------------
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cargo-project-serve
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cargo-project-serve

      # Graceful shutdown — give the app time to drain in-flight requests
      terminationGracePeriodSeconds: 30

      containers:
        - name: cargo-project-serve
          # Replace with your actual registry/image in production:
          # image: ghcr.io/your-org/cargo-project-serve:0.1.0
          image: cargo-project-serve:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # -------------------------------------------------------------------
          # Environment — sourced from ConfigMap and Secrets
          # -------------------------------------------------------------------
          envFrom:
            - configMapRef:
                name: cargo-project-config
          env:
            # Pull the database connection string from a Secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cargo-project-secrets
                  key: DATABASE_URL
                  optional: true   # service starts without a DB in dev

          # -------------------------------------------------------------------
          # Resource requests and limits
          # Requests: guaranteed allocation; Limits: hard cap.
          # Tune these based on actual profiling data.
          # -------------------------------------------------------------------
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          # -------------------------------------------------------------------
          # Probes
          # -------------------------------------------------------------------
          # Liveness: if this fails, kubelet restarts the container.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # Readiness: if this fails, the pod is removed from Service endpoints
          # (traffic stops being routed to it) but the container is not restarted.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          # Startup: gives slow-starting containers time to initialise before
          # liveness kicks in (failureThreshold * periodSeconds = 60s budget).
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
            successThreshold: 1

          # -------------------------------------------------------------------
          # Security context — per-container hardening
          # -------------------------------------------------------------------
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # Writable tmp directory (distroless has none by default)
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # Replace with a PersistentVolumeClaim in production for SQLite data
        - name: data
          emptyDir:
            sizeLimit: 1Gi

      # Prefer spreading across different nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cargo-project-serve
                topologyKey: kubernetes.io/hostname

---
# ---------------------------------------------------------------------------
# Service — ClusterIP for internal cluster access
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: cargo-project-serve
  namespace: default
  labels:
    app.kubernetes.io/name: cargo-project-serve
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cargo-project-serve
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

---
# ---------------------------------------------------------------------------
# HorizontalPodAutoscaler — scale between 2 and 10 pods based on CPU
# ---------------------------------------------------------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cargo-project-serve
  namespace: default
  labels:
    app.kubernetes.io/name: cargo-project-serve
    app.kubernetes.io/component: server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cargo-project-serve
  minReplicas: 2
  maxReplicas: 10
  metrics:
    # Scale on CPU utilisation
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Scale on memory pressure (optional — tune threshold to your workload)
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        # Allow adding up to 4 pods per 60 seconds
        - type: Pods
          value: 4
          periodSeconds: 60
        # Or 100% of current replicas, whichever is smaller
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Min
    scaleDown:
      stabilizationWindowSeconds: 300   # Wait 5 minutes before scaling down
      policies:
        # Remove at most 1 pod per 60 seconds (conservative scale-down)
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Max
