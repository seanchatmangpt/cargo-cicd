# cargo-deny configuration for supply chain security.
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

# ---------------------------------------------------------------------------
# Graph — limit which target triples are checked so platform-specific crates
# that are pulled in only for macOS/Windows don't produce spurious warnings
# when building on Linux CI.
# ---------------------------------------------------------------------------
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# ---------------------------------------------------------------------------
# Advisories — vulnerability and maintenance status checks against the
# RustSec advisory database.
# ---------------------------------------------------------------------------
[advisories]
# Local path where the advisory DB is cached.
db-path = "~/.cargo/advisory-db"

# Remote advisory database URL(s).
db-urls = ["https://github.com/rustsec/advisory-db"]

# Deny any crate with a published vulnerability — blocks CI immediately.
vulnerability = "deny"

# Warn on unmaintained crates; escalate to "deny" before a production release.
unmaintained = "warn"

# Deny crates with known unsound (undefined-behaviour) issues.
unsound = "deny"

# Warn on informational notices so they are visible without blocking.
notice = "warn"

# Advisories explicitly ignored (add with care; document the reason inline):
# ignore = [
#   { id = "RUSTSEC-YYYY-NNNN", reason = "<why this is acceptable>" },
# ]
ignore = []

# ---------------------------------------------------------------------------
# Licenses — only OSI/FSF-approved permissive licences are allowed.
# Copyleft licences are warned (not denied) so a human makes the call.
# ---------------------------------------------------------------------------
[licenses]
# Allowlist of SPDX licence identifiers accepted in this workspace.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "OpenSSL",
]

# Explicit deny list — these are blocked even if cargo-deny's heuristics
# would otherwise accept them.
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "AGPL-3.0",
    "LGPL-2.0",
    "LGPL-2.1",
    "LGPL-3.0",
    "BUSL-1.1",
]

# Copyleft licences that are neither GPL nor in the explicit deny list above
# produce a warning rather than a hard failure. A human must review before
# adding any dependency with a copyleft licence.
copyleft = "warn"

# Do NOT automatically allow all OSI/FSF-free licences — only what is on the
# explicit allowlist above.
allow-osi-fsf-free = "neither"

# Any licence not in `allow` and not matched by the rules above is denied.
default = "deny"

# Per-crate exceptions for dual-licensed or unusual crates.
# Add entries here only when a crate's licence is acceptable despite not
# appearing verbatim in `allow`.
# exceptions = [
#   { allow = ["LicenseRef-ring"], crate = "ring" },
# ]

# ---------------------------------------------------------------------------
# Bans — duplicate versions and wildcard dependency constraints.
# ---------------------------------------------------------------------------
[bans]
# Warn on multiple versions of the same crate in the dependency tree.
# Duplicates inflate binary size and complicate auditing; resolve when possible.
multiple-versions = "warn"

# Allow wildcard version constraints (common in generated code and proc-macros).
wildcards = "allow"

# Crates that are entirely banned from the workspace dependency graph.
deny = []

# Specific duplicate versions that are acceptable (e.g. ecosystem hasn't
# migrated yet). Add with a `reason` so the exception is self-documenting.
# skip = [
#   { name = "some-crate", version = "=0.x.y", reason = "ecosystem hasn't migrated" },
# ]
skip = []

# ---------------------------------------------------------------------------
# Sources — only crates.io is an allowed registry; unknown Git sources are
# denied to prevent supply-chain confusion.
# ---------------------------------------------------------------------------
[sources]
# Deny crates sourced from any registry other than those explicitly allowed.
unknown-registry = "deny"

# Deny crates sourced from arbitrary Git repositories not in the allowlist.
unknown-git = "deny"

# The official crates.io index is the only allowed registry.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Specific Git repositories that are allowed as dependency sources.
# Add entries here for any private or fork Git dependencies.
# allow-git = [
#   "https://github.com/your-org/some-fork",
# ]
