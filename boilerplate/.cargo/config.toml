# =============================================================================
# .cargo/config.toml — workspace-level Cargo configuration
# https://doc.rust-lang.org/cargo/reference/config.html
# =============================================================================

# ---------------------------------------------------------------------------
# Reproducible builds — path remapping
# Strip build-time absolute paths from binaries so release artifacts are
# byte-for-byte reproducible across different machines and CI runners.
# Set in release CI via the RUSTFLAGS env var rather than here to avoid
# embedding developer machine paths in local debug builds.
# See .github/workflows/release.yml (build job env: RUSTFLAGS).
# ---------------------------------------------------------------------------

[build]
# Use all available parallelism; CI overrides this with CARGO_BUILD_JOBS.
jobs = 0

[net]
# Fetch git dependencies via the system git binary for better credential
# handling (respects SSH agent, credential helpers, and proxy settings).
git-fetch-with-cli = true
# Retry transient network errors — common in CI environments with rate-limited
# or flaky registries.
retry = 3

[registry]
default = "crates-io"

[registries.crates-io]
# Sparse index is faster than the legacy git index (~10x on cold fetch).
protocol = "sparse"

# ---------------------------------------------------------------------------
# Handy aliases — saves typing on the most common commands
# ---------------------------------------------------------------------------
[alias]
t   = "nextest run --workspace"
b   = "build --workspace"
br  = "build --workspace --release"
c   = "check --workspace --all-targets --all-features"
cl  = "clippy --workspace --all-targets --all-features -- -D warnings"

[profile.dev]
# Split debug info to speed up incremental links (Linux/macOS only).
# On Windows this is silently ignored; no harm keeping it cross-platform.
split-debuginfo = "unpacked"

[profile.dev.package."*"]
# Compile third-party crates at opt-level 1 even in dev builds.
# Keeps your code debuggable while making test runs measurably faster.
opt-level = 1

[profile.release]
# Already declared in the workspace Cargo.toml; these settings are mirrored
# here so the config file is self-documenting and values are visible without
# opening the manifest.
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
