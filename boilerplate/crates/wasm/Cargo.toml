[package]
name = "project-wasm"
version = "0.1.0"
edition = "2021"

# cdylib for wasm-pack output (.wasm + JS glue), rlib for Rust consumers (tests, benchmarks)
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

# Aggressive size optimisation for .wasm output
[profile.release]
opt-level = "z"      # minimise binary size (vs speed at "s" or "3")
lto = true           # link-time optimisation across crate boundaries
codegen-units = 1    # single codegen unit maximises LTO effectiveness
strip = true         # strip debug symbols
panic = "abort"      # no unwinding machinery in the .wasm
