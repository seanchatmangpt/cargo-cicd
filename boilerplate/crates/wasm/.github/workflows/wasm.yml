name: WASM CI

on:
  push:
    branches: ["main", "master"]
    paths:
      - "crates/wasm/**"
      - "scripts/build-wasm.sh"
      - ".github/workflows/wasm.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "crates/wasm/**"
      - "scripts/build-wasm.sh"
      - ".github/workflows/wasm.yml"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ------------------------------------------------------------------
  # 1. Lint & type-check (fast; no WASM toolchain needed)
  # ------------------------------------------------------------------
  check:
    name: Check (host target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        working-directory: crates/wasm
        run: cargo fmt --check

      - name: Clippy
        working-directory: crates/wasm
        run: cargo clippy -- -D warnings

      - name: Host unit tests (no browser required)
        working-directory: crates/wasm
        run: cargo test --lib

  # ------------------------------------------------------------------
  # 2. wasm-pack build — produces the distributable pkg/
  # ------------------------------------------------------------------
  build:
    name: wasm-pack build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          wasm-pack --version

      - name: wasm-pack build (--target web)
        working-directory: crates/wasm
        run: wasm-pack build --target web --out-dir pkg/

      - name: Verify pkg/ artefacts exist
        working-directory: crates/wasm
        run: |
          test -f pkg/project_wasm_bg.wasm
          test -f pkg/project_wasm.js
          test -f pkg/project_wasm.d.ts
          echo "All expected artefacts present."

      - name: Report .wasm size
        working-directory: crates/wasm
        run: |
          SIZE=$(wc -c < pkg/project_wasm_bg.wasm)
          echo "WASM binary size: ${SIZE} bytes"

      - name: Upload pkg/ artefact
        uses: actions/upload-artifact@v4
        with:
          name: project-wasm-pkg
          path: crates/wasm/pkg/
          retention-days: 7

  # ------------------------------------------------------------------
  # 3. wasm-bindgen-test in Node (no browser binary needed in CI)
  # ------------------------------------------------------------------
  test-node:
    name: wasm-bindgen-test (Node)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run wasm-bindgen-test (Node runtime)
        working-directory: crates/wasm
        run: wasm-pack test --node

  # ------------------------------------------------------------------
  # 4. wasm-bindgen-test in headless Chrome
  # ------------------------------------------------------------------
  test-browser:
    name: wasm-bindgen-test (Chrome headless)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-browser-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-browser-

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Run wasm-bindgen-test (headless Chrome)
        working-directory: crates/wasm
        run: wasm-pack test --headless --chrome
