[workspace]
resolver = "2"
members = [
    "src",
    "crates/core",
    "crates/domain",
    "crates/service",
    "crates/sqlite",
    "crates/mcp-server",
    "crates/config",
]

[workspace.package]
edition = "2021"
rust-version = "1.86"
authors = ["seanchatmangpt"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/seanchatmangpt/PROJECT"
homepage = "https://github.com/seanchatmangpt/PROJECT"
keywords = []
categories = []

[workspace.dependencies]
# Core crate (this workspace)
project-core = { path = "crates/core", version = "0.1.0" }
project-domain = { path = "crates/domain", version = "0.1.0" }
project-config = { path = "crates/config", version = "0.1.0" }

# Error handling
anyhow = "1"
thiserror = "1"

# CLI
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap-noun-verb = "26.6.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["parse", "display"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "time", "signal"] }
async-trait = "0.1"

# Filesystem / process
walkdir = "2"
ignore = "0.4"

# Concurrency
parking_lot = "0.12"
once_cell = "1"
rayon = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP service
axum = { version = "0.8", features = ["macros", "json", "tokio"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip", "request-id", "timeout"] }
hyper = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "uuid", "chrono", "json"] }

# Performance / advanced
blake3 = "1"
moka = { version = "0.12", features = ["sync"] }
dashmap = "6"

# Shell completions
clap_complete = "4"

# TUI (optional — activated by `tui` feature in the CLI crate)
ratatui = "0.29"
crossterm = "0.28"

# Testing
assert_cmd = "2"
predicates = "3"
tempfile = "3"
insta = { version = "1", features = ["json", "redactions"] }
proptest = { version = "1", features = ["std"] }
criterion = { version = "0.5", features = ["html_reports"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow common patterns that pedantic flags as noise
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_imports = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.test]
opt-level = 1
