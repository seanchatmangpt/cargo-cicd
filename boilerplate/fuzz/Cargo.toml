[package]
name = "cargo-project-fuzz"
version = "0.0.1"
publish = false
edition = "2021"

# cargo-fuzz requires a nightly toolchain:
#   rustup override set nightly
#   cargo install cargo-fuzz
#
# Then from the workspace root:
#   cargo +nightly fuzz run parse_verdict
#   cargo +nightly fuzz run parse_workspace_id
#   cargo +nightly fuzz run core_error_display

[package.metadata]
cargo-fuzz = true

[dependencies]
# libfuzzer-sys wraps the LLVM libFuzzer entry point.
libfuzzer-sys = "0.4"

# The crate under test.  Adjust the path to match your workspace layout.
project_core = { path = "../../crates/project-core" }

# Fuzz targets live in fuzz_targets/ — each gets its own [[bin]] entry.

[[bin]]
name = "parse_verdict"
path = "fuzz_targets/parse_verdict.rs"
test = false
doc = false

[[bin]]
name = "parse_workspace_id"
path = "fuzz_targets/parse_workspace_id.rs"
test = false
doc = false

[[bin]]
name = "core_error_display"
path = "fuzz_targets/core_error_display.rs"
test = false
doc = false

# -------------------------------------------------------------------------------
# Cargo-fuzz automatically sets the following flags in .cargo/config.toml inside
# this directory; they are reproduced here for documentation:
#
# [build]
# rustflags = ["-C", "passes=sancov-module", "-C", "llvm-args=-sanitizer-coverage-inline-8bit-counters", ...]
#
# Do NOT commit this to version control — cargo-fuzz regenerates it each run.
# -------------------------------------------------------------------------------
