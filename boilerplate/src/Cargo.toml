[package]
name = "project"
version = "0.1.0"
description = "PROJECT keeps your Rust workspace clean, fast, and push-ready."
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cargo-project"
path = "main.rs"

[lib]
name = "project"
path = "lib.rs"

# Integration test targets (live at workspace root ../tests/ relative to this manifest)
[[test]]
name = "invariants"
path = "../tests/invariants.rs"

[[test]]
name = "cli"
path = "../tests/cli/mod.rs"

[dependencies]
# Workspace core
project-core.workspace = true

# Error handling
anyhow.workspace = true

# CLI
clap = { workspace = true }
clap_complete = { workspace = true, optional = true }

# Serialization
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# Filesystem scanning
walkdir.workspace = true

# Concurrency helpers
once_cell.workspace = true

# Observability
tracing.workspace = true
tracing-subscriber.workspace = true

# Advanced (optional — activated by `advanced` feature)
blake3 = { workspace = true, optional = true }
moka = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
ignore = { workspace = true, optional = true }

# TUI (optional — activated by `tui` feature)
ratatui = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
insta.workspace = true
proptest.workspace = true
criterion = { version = "0.5", features = ["html_reports"] }

[[test]]
name = "property_tests"
path = "../tests/property/mod.rs"

[[test]]
name = "snapshot_tests"
path = "../tests/snapshot/mod.rs"

[[test]]
name = "engine_tests"
path = "../tests/integration/engine_tests.rs"
required-features = ["process-data"]

[[bench]]
name = "verdict_bench"
path = "../tests/benches/verdict_bench.rs"
harness = false

[profile.bench]
lto = "thin"
codegen-units = 1
opt-level = 3

[features]
default = []
# Level 5 engine internals — EngineState, adapters, cicd.toml carrier.
process-data = []
# Autonomic policy suggestions (read-only). Implies process-data.
autonomic = ["process-data"]
# Shell completions via clap_complete.
completions = ["dep:clap_complete"]
# Advanced: high-performance scanning, caching, observability.
advanced = ["process-data", "dep:blake3", "dep:moka", "dep:dashmap", "dep:rayon", "dep:ignore"]
# Interactive TUI dashboard.
tui = ["process-data", "dep:ratatui", "dep:crossterm"]
