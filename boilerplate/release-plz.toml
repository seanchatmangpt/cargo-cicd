# release-plz.toml
#
# Drives automated release PRs via the MarcoIeni/release-plz-action workflow.
# On every push to main, release-plz:
#   1. Detects unreleased conventional commits.
#   2. Opens (or updates) a "chore(release): vX.Y.Z" PR with a CHANGELOG diff.
#   3. When that PR is merged, creates the git tag — which fires release.yml.
#
# Crates are NOT auto-published to crates.io; the tag-triggered release.yml
# workflow is the publish gate so a human can review binaries first.

[workspace]
# Append new entries to CHANGELOG.md on every release PR.
changelog_update = true

# Create a GitHub Release when the release PR is merged (tag fires release.yml
# which also creates the release, but having release-plz do it too is harmless
# and provides a consistent tag → release link even if release.yml is skipped).
git_release_enable = true

# Create an annotated git tag vX.Y.Z on release PR merge.
git_tag_enable = true

# Do NOT auto-push to crates.io.  Publishing requires explicit human sign-off
# and the binary release gate in release.yml.
publish = false

# ---------------------------------------------------------------------------
# Per-package overrides
# ---------------------------------------------------------------------------

[[package]]
name = "project"

# CHANGELOG.md lives at the workspace root (next to src/).
changelog_path = "CHANGELOG.md"

# Keep commit bodies out of the changelog — titles are sufficient.
changelog_include_commit_body = false

# Release name shown on the GitHub Release page.
git_release_name = "v{{ version }}"

# Release body is the freshly generated changelog section for this version.
git_release_body = "{% raw %}{{ changelog }}{% endraw %}"
