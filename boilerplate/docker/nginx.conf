# =============================================================================
# docker/nginx.conf — Nginx reverse proxy for cargo-project-serve
# Drop this into the Nginx container at /etc/nginx/conf.d/default.conf
# =============================================================================

# ---------------------------------------------------------------------------
# Rate-limiting zones (defined at http{} scope, placed here via include)
# ---------------------------------------------------------------------------
limit_req_zone  $binary_remote_addr  zone=api_limit:10m  rate=60r/m;
limit_conn_zone $binary_remote_addr  zone=conn_limit:10m;

# ---------------------------------------------------------------------------
# Upstream — the app service inside the Docker network
# keepalive 32 means up to 32 idle connections are reused per worker.
# ---------------------------------------------------------------------------
upstream app {
    server app:8080;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# Server block — HTTP (port 80)
# For TLS termination, add a second server block on port 443 and redirect
# port 80 → 443. Certificate paths are left as comments below.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name _;          # Catch-all; replace with your domain in production

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------
    add_header X-Content-Type-Options    "nosniff"           always;
    add_header X-Frame-Options           "DENY"              always;
    add_header X-XSS-Protection          "1; mode=block"     always;
    add_header Referrer-Policy           "no-referrer"       always;
    add_header Permissions-Policy        "geolocation=()"    always;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log  warn;

    # -------------------------------------------------------------------------
    # Health endpoint — no rate limiting, no auth, used by load balancers
    # -------------------------------------------------------------------------
    location /health {
        proxy_pass         http://app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_read_timeout 5s;
        proxy_connect_timeout 3s;

        # Do not log health checks (reduces noise)
        access_log off;
    }

    location /health/live  { proxy_pass http://app; access_log off; }
    location /health/ready { proxy_pass http://app; access_log off; }

    # -------------------------------------------------------------------------
    # API routes — rate limited
    # -------------------------------------------------------------------------
    location /api/ {
        # Rate limiting: burst of 20 requests; excess requests are queued
        limit_req  zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 20;

        proxy_pass         http://app;
        proxy_http_version 1.1;

        # Pass original client info
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Unique request ID for distributed tracing
        proxy_set_header   X-Request-ID      $request_id;
        add_header         X-Request-ID      $request_id always;

        # Keep-alive to the upstream
        proxy_set_header   Connection        "";

        # Timeouts
        proxy_connect_timeout  5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        # Buffer settings
        proxy_buffering          on;
        proxy_buffer_size        4k;
        proxy_buffers            8 16k;
        proxy_busy_buffers_size  32k;

        # Hide upstream version headers
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # -------------------------------------------------------------------------
    # Catch-all — forward everything else to the app
    # -------------------------------------------------------------------------
    location / {
        proxy_pass         http://app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_set_header   Connection        "";

        proxy_connect_timeout  5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # -------------------------------------------------------------------------
    # Deny access to hidden files (e.g. .git, .env)
    # -------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

