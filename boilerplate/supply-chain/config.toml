# cargo-vet supply chain configuration.
# Run: cargo vet
# Docs: https://mozilla-services.github.io/cargo-vet/

[cargo-vet]
version = "0.10"

# Trust our own workspace crates implicitly.
[policy]
audit-as-crates-io = false

# Import trusted audit sets from well-known sources to bootstrap coverage.
# These are published by organisations who have already audited many crates.
[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/cargo-vet/main/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/cargo-vet/main/audits.toml"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/cargo-vet/main/audits.toml"

[imports.isrg]
url = "https://raw.githubusercontent.com/letsencrypt/cargo-vet/main/audits.toml"
