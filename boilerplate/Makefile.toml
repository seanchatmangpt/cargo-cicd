[config]
default_to_workspace = false
skip_core_tasks = false

[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true
CARGO_TERM_COLOR = "always"
RUST_BACKTRACE = "1"
RUSTDOCFLAGS = "-D warnings"
MSRV = "1.86"

# ──────────────────────────────────────────────────────────────────────────────
# Formatting
# ──────────────────────────────────────────────────────────────────────────────

[tasks.fmt]
description = "Auto-format all crates with rustfmt"
command = "cargo"
args = ["fmt", "--all"]

[tasks.fmt-check]
description = "Check formatting without modifying files (< 2s)"
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

# ──────────────────────────────────────────────────────────────────────────────
# Lint
# ──────────────────────────────────────────────────────────────────────────────

[tasks.clippy]
description = "Run Clippy with --all-features, deny warnings (< 30s)"
command = "cargo"
args = [
  "clippy",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--",
  "-D", "warnings",
]

[tasks.lint]
description = "Run fmt-check then clippy --all-features (< 30s total)"
dependencies = ["fmt-check", "clippy"]

# ──────────────────────────────────────────────────────────────────────────────
# Type-check (no binary produced)
# ──────────────────────────────────────────────────────────────────────────────

[tasks.check]
description = "Type-check workspace with all targets and features (fastest build gate)"
command = "cargo"
args = ["check", "--workspace", "--all-targets", "--all-features"]

# ──────────────────────────────────────────────────────────────────────────────
# Build
# ──────────────────────────────────────────────────────────────────────────────

[tasks.build]
description = "Build the workspace in debug mode"
command = "cargo"
args = ["build", "--workspace"]

[tasks.build-release]
description = "Build the workspace in release mode"
command = "cargo"
args = ["build", "--workspace", "--release"]

# ──────────────────────────────────────────────────────────────────────────────
# Tests
# ──────────────────────────────────────────────────────────────────────────────

# Internal helper: nextest run (skipped gracefully when nextest is absent)
[tasks.nextest-run]
description = "Run workspace tests via cargo-nextest --all-features --profile ci"
condition = { condition_type = "which", binary = "cargo-nextest" }
command = "cargo"
args = [
  "nextest",
  "run",
  "--workspace",
  "--all-features",
  "--profile", "ci",
]

[tasks.nextest-missing]
description = "Hint: install cargo-nextest if not found"
condition = { condition_type = "which_binary", binary = "cargo-nextest", negate = true }
script = [
  "echo '  [skip] cargo-nextest not found — falling back to cargo test'",
  "echo '         Install with: cargo install cargo-nextest --locked'",
]

# Doctest step (nextest does not run doctests)
[tasks.doctest]
description = "Run workspace doctests (nextest does not cover these)"
command = "cargo"
args = ["test", "--doc", "--workspace", "--all-features"]

# Primary test task: nextest (or graceful skip) + doctests
[tasks.test]
description = "Run all tests: nextest --all-features --profile ci + cargo test --doc"
run_task = { name = ["nextest-run", "nextest-missing", "doctest"], parallel = false }

# Invariant-only shortcut (mirrors GH Actions step)
[tasks.test-invariants]
description = "Run only the public-boundary invariant tests"
command = "cargo"
args = ["test", "--workspace", "--test", "invariants"]

# ──────────────────────────────────────────────────────────────────────────────
# Feature-flag matrix (mirrors GH Actions features job)
# ──────────────────────────────────────────────────────────────────────────────

[tasks.test-features-default]
description = "Test with default features (no flags)"
command = "cargo"
args = ["test", "--workspace"]

[tasks.test-features-process-data]
description = "Test with --features process-data"
command = "cargo"
args = ["test", "--workspace", "--features", "process-data"]

[tasks.test-features-autonomic]
description = "Test with --features autonomic"
command = "cargo"
args = ["test", "--workspace", "--features", "autonomic"]

[tasks.test-features-advanced]
description = "Test with --features advanced"
command = "cargo"
args = ["test", "--workspace", "--features", "advanced"]

[tasks.test-features]
description = "Run test suite for each named feature combination: default, process-data, autonomic, advanced"
dependencies = [
  "test-features-default",
  "test-features-process-data",
  "test-features-autonomic",
  "test-features-advanced",
]

# ──────────────────────────────────────────────────────────────────────────────
# Feature-powerset check (cargo-hack)
# ──────────────────────────────────────────────────────────────────────────────

[tasks.feature-check]
description = "Check feature powerset (depth 2) via cargo-hack; install hint if missing"
script_runner = "@shell"
script = [
  '''
  if command -v cargo-hack >/dev/null 2>&1; then
    cargo hack check --workspace --feature-powerset --depth 2
  else
    echo "  [skip] cargo-hack not found."
    echo "         Install with: cargo install cargo-hack --locked"
    exit 0
  fi
  ''',
]

# ──────────────────────────────────────────────────────────────────────────────
# MSRV check
# ──────────────────────────────────────────────────────────────────────────────

[tasks.msrv-check]
description = "Check workspace compiles on MSRV (Rust 1.86) with all targets"
script_runner = "@shell"
script = [
  '''
  if rustup toolchain list | grep -q "^1.86"; then
    cargo +1.86 check --workspace --all-targets
  else
    echo "  [skip] Rust 1.86 toolchain not installed."
    echo "         Install with: rustup toolchain install 1.86"
    exit 0
  fi
  ''',
]

# ──────────────────────────────────────────────────────────────────────────────
# Documentation
# ──────────────────────────────────────────────────────────────────────────────

[tasks.docs]
description = "Build workspace docs with -D warnings and --all-features (mirrors GH Actions docs job)"
env = { RUSTDOCFLAGS = "-D warnings" }
command = "cargo"
args = ["doc", "--workspace", "--no-deps", "--all-features"]

[tasks.docs-open]
description = "Build workspace docs and open in browser"
env = { RUSTDOCFLAGS = "-D warnings" }
command = "cargo"
args = ["doc", "--workspace", "--no-deps", "--all-features", "--open"]

# ──────────────────────────────────────────────────────────────────────────────
# Fix tasks (destructive — auto-correct)
# ──────────────────────────────────────────────────────────────────────────────

[tasks.fix]
description = "Auto-fix compiler warnings with cargo fix, then reformat"
dependencies = ["fix-code", "fmt"]

[tasks.fix-code]
description = "Run cargo fix --workspace --allow-dirty to apply automatic fixes"
command = "cargo"
args = ["fix", "--workspace", "--allow-dirty"]

# ──────────────────────────────────────────────────────────────────────────────
# Security & dependency hygiene
# ──────────────────────────────────────────────────────────────────────────────

[tasks.audit]
description = "Run cargo audit for known security advisories; install hint if missing"
script_runner = "@shell"
script = [
  '''
  if command -v cargo-audit >/dev/null 2>&1; then
    cargo audit
  else
    echo "  [skip] cargo-audit not found."
    echo "         Install with: cargo install cargo-audit --locked"
    exit 0
  fi
  ''',
]

[tasks.deny]
description = "Run cargo deny check for license/ban/advisories; install hint if missing"
script_runner = "@shell"
script = [
  '''
  if command -v cargo-deny >/dev/null 2>&1; then
    cargo deny check
  else
    echo "  [skip] cargo-deny not found."
    echo "         Install with: cargo install cargo-deny --locked"
    exit 0
  fi
  ''',
]

# ──────────────────────────────────────────────────────────────────────────────
# Binary size analysis
# ──────────────────────────────────────────────────────────────────────────────

[tasks.bloat]
description = "Analyse per-crate binary size contribution via cargo-bloat; skip if missing"
script_runner = "@shell"
script = [
  '''
  if command -v cargo-bloat >/dev/null 2>&1; then
    cargo bloat --release --crates
  else
    echo "  [skip] cargo-bloat not found."
    echo "         Install with: cargo install cargo-bloat"
    exit 0
  fi
  ''',
]

# ──────────────────────────────────────────────────────────────────────────────
# Maintenance
# ──────────────────────────────────────────────────────────────────────────────

[tasks.clean]
description = "Remove all build artifacts (cargo clean)"
command = "cargo"
args = ["clean"]

[tasks.update]
description = "Update all dependencies to latest compatible versions"
command = "cargo"
args = ["update"]

# ──────────────────────────────────────────────────────────────────────────────
# Composite gates
# ──────────────────────────────────────────────────────────────────────────────

# quick — used in pre-commit hooks; must finish in under 60s
[tasks.quick]
description = "Fast pre-commit gate: fmt-check + lint + nextest default profile (< 60s)"
run_task = { name = ["fmt-check", "lint", "nextest-run", "nextest-missing"] }

# ci — exact mirror of the GH Actions pipeline, same order
# Gates: fmt → clippy → build → test → test-invariants → feature-check → docs
[tasks.ci]
description = "Full CI gate mirroring GH Actions: fmt-check, lint, build, test, test-invariants, feature-check, docs"
dependencies = [
  "fmt-check",
  "lint",
  "build",
  "test",
  "test-invariants",
  "feature-check",
  "docs",
]

# pre-push — everything in ci plus MSRV; run before every git push
[tasks.pre-push]
description = "Pre-push gate: ci + msrv-check (all gates before a push)"
dependencies = ["ci", "msrv-check"]
