# =============================================================================
# docker-compose.override.yml — development overrides
# Docker Compose merges this file automatically when both files are present.
# Usage: docker compose up        (applies both files)
#        docker compose -f docker-compose.yml up   (production only)
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Override the production image tag for dev
    image: cargo-project-serve:dev
    # Source code is mounted so cargo-watch can see changes without rebuilding
    # the image. The named volumes shadow target/ and the Cargo registry so
    # they persist across container restarts and don't bleed into the host.
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target-cache:/app/target
    environment:
      RUST_LOG: debug
      APP_ENV: development
      DATABASE_URL: "sqlite:///data/app-dev.db"
      # Enable backtraces for easier debugging
      RUST_BACKTRACE: "1"
    # Expose extra ports for debugging / profiling if needed
    ports:
      - "8080:8080"
      - "9229:9229"   # reserved for future debugger attach
    # Development container does not need the same hardening as production
    read_only: false
    cap_drop: []
    security_opt: []
    # No restart in dev — let the developer control the lifecycle
    restart: "no"

volumes:
  cargo-registry:
    driver: local
  cargo-git:
    driver: local
  target-cache:
    driver: local
