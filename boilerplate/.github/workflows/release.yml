name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# ---------------------------------------------------------------------------
# Job 1: validate-tag
# Ensures the tag is strict semver and that Cargo.toml agrees on version.
# All downstream jobs gate on this one.
# ---------------------------------------------------------------------------
jobs:
  validate-tag:
    name: Validate tag and Cargo.toml version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse and validate tag
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"

          # Enforce strict vMAJOR.MINOR.PATCH[-prerelease] format
          if [[ ! "${TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            echo "::error title=Bad tag format::Tag '${TAG}' does not start with vX.Y.Z"
            exit 1
          fi

          VERSION="${BASH_REMATCH[1]}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Tag validated: ${TAG} -> ${VERSION}"

      - name: Verify Cargo.toml version matches tag
        run: |
          VERSION="${{ steps.parse.outputs.version }}"
          # Strip any pre-release suffix for Cargo.toml comparison
          BASE_VERSION="${VERSION%%-*}"

          if ! grep -qE "^version = \"${BASE_VERSION}\"" Cargo.toml; then
            CARGO_VER=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            echo "::error title=Version mismatch::Cargo.toml has version '${CARGO_VER}' but tag is 'v${BASE_VERSION}'."
            echo "::error::Fix: update Cargo.toml to version = \"${BASE_VERSION}\", commit, then re-tag."
            exit 1
          fi

          echo "Cargo.toml version confirmed: ${BASE_VERSION}"

# ---------------------------------------------------------------------------
# Job 2: build
# Cross-compiles for all 6 target triples and produces per-target tarballs /
# zips plus individual .sha256 sidecar files.
# ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }}
    needs: validate-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            use_cross: false
            archive: tar

          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            use_cross: true
            archive: tar

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            use_cross: true
            archive: tar

          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
            use_cross: false
            archive: tar

          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
            use_cross: false
            archive: tar

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
            use_cross: false
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      # ---- Install cross for non-native Linux targets ----
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      # ---- Build: cross for musl/aarch64-linux ----
      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} --bin cargo-project

      # ---- Build: native cargo for macOS / Windows / x86_64-linux-gnu ----
      - name: Build (cargo)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }} --bin cargo-project

      # ---- Strip binary (Linux / macOS only) ----
      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BINARY="target/${{ matrix.target }}/release/cargo-project"
          # aarch64 cross-compiled binaries may need the cross-strip; fall back gracefully
          if command -v aarch64-linux-gnu-strip &>/dev/null && [[ "${{ matrix.target }}" == aarch64* ]]; then
            aarch64-linux-gnu-strip "${BINARY}" || strip "${BINARY}" || true
          else
            strip "${BINARY}" || true
          fi

      # ---- Package: tar.gz for Unix ----
      - name: Package (tar.gz — Unix)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          VERSION="${{ needs.validate-tag.outputs.version }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="cargo-project-${VERSION}-${TARGET}.tar.gz"

          tar czf "${ARCHIVE}" \
            -C "target/${TARGET}/release" \
            "cargo-project"

          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          echo "ARCHIVE=${ARCHIVE}" >> "${GITHUB_ENV}"

      # ---- Package: zip for Windows ----
      - name: Package (zip — Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $VERSION = "${{ needs.validate-tag.outputs.version }}"
          $TARGET  = "${{ matrix.target }}"
          $ARCHIVE = "cargo-project-${VERSION}-${TARGET}.zip"

          Compress-Archive `
            -Path "target\${TARGET}\release\cargo-project.exe" `
            -DestinationPath $ARCHIVE

          $hash = (Get-FileHash $ARCHIVE -Algorithm SHA256).Hash.ToLower()
          "$hash  $ARCHIVE" | Out-File -Encoding ASCII "${ARCHIVE}.sha256"

          "ARCHIVE=$ARCHIVE" | Out-File -Append -Encoding ASCII $env:GITHUB_ENV

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          retention-days: 1
          if-no-files-found: error

# ---------------------------------------------------------------------------
# Job 3: checksums
# Downloads every per-target artifact, concatenates the .sha256 sidecars into
# a single checksums.sha256, and re-uploads it.  Also base64-encodes the full
# checksum set for the SLSA provenance job.
# ---------------------------------------------------------------------------
  checksums:
    name: Aggregate checksums
    needs: build
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.b64.outputs.hashes }}
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts/

      - name: Collect archives and checksums
        run: |
          mkdir -p release-files
          find all-artifacts/ -type f | while read -r f; do
            cp "$f" release-files/
          done
          echo "Release files:"
          ls -lh release-files/

      - name: Generate checksums.sha256
        run: |
          cd release-files
          cat *.sha256 | sort > checksums.sha256
          echo "checksums.sha256:"
          cat checksums.sha256

      - name: Base64-encode checksums for SLSA
        id: b64
        run: |
          HASHES=$(base64 -w0 release-files/checksums.sha256)
          echo "hashes=${HASHES}" >> "${GITHUB_OUTPUT}"

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: release-files/checksums.sha256
          retention-days: 1
          if-no-files-found: error

# ---------------------------------------------------------------------------
# Job 4: provenance (SLSA level 3)
# Uses the official SLSA GitHub Generator to produce a signed provenance
# attestation for the release binaries.  Runs after checksums so it can
# consume the base64-encoded checksum hashes.
# ---------------------------------------------------------------------------
  provenance:
    name: SLSA provenance
    needs: checksums
    permissions:
      actions: read
      id-token: write
      contents: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2
    with:
      base64-subjects: "${{ needs.checksums.outputs.hashes }}"
      upload-assets: false

# ---------------------------------------------------------------------------
# Job 5: create-release
# Extracts the CHANGELOG section for this version, creates the GitHub Release,
# and attaches all archives, checksums, and the SLSA provenance bundle.
# ---------------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    needs: [build, checksums, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: all-artifacts/
          merge-multiple: true

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: checksums
          path: all-artifacts/

      - name: Download SLSA provenance
        uses: actions/download-artifact@v4
        with:
          pattern: "*.intoto.jsonl"
          path: all-artifacts/
          merge-multiple: true

      - name: Extract CHANGELOG section
        id: changelog
        shell: bash
        run: |
          VERSION="${{ needs.validate-tag.outputs.version }}"
          # Strip pre-release suffix for CHANGELOG heading lookup
          BASE_VERSION="${VERSION%%-*}"

          if [[ -f CHANGELOG.md ]]; then
            awk \
              -v ver="[${BASE_VERSION}]" \
              '/^## \[/{if(p)exit; if(index($0, ver)){p=1; next}} p' \
              CHANGELOG.md \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
              > /tmp/release_body.md

            # Fall back if awk matched nothing
            if [[ ! -s /tmp/release_body.md ]]; then
              echo "See commit history for changes in this release." > /tmp/release_body.md
            fi
          else
            echo "See commit history for changes in this release." > /tmp/release_body.md
          fi

          echo "Release body preview (first 20 lines):"
          head -20 /tmp/release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "cargo-project ${{ github.ref_name }}"
          body_path: /tmp/release_body.md
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          fail_on_unmatched_files: false
          files: |
            all-artifacts/*.tar.gz
            all-artifacts/*.zip
            all-artifacts/checksums.sha256
            all-artifacts/*.intoto.jsonl
          token: ${{ secrets.GITHUB_TOKEN }}

# ---------------------------------------------------------------------------
# Job 6: publish-crates
# Publishes to crates.io after a successful release.  Skipped for pre-releases
# (tags containing a hyphen, e.g. v1.2.3-rc.1).
# ---------------------------------------------------------------------------
  publish-crates:
    name: Publish to crates.io
    needs: create-release
    if: "!contains(github.ref, '-')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          key: publish-${{ hashFiles('**/Cargo.lock') }}

      - name: Publish workspace crates
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
