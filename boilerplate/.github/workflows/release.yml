name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate-tag:
    name: Validate semver tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Parse and validate tag
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "${TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '${TAG}' does not match semver format vX.Y.Z"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Tag is valid: ${TAG} -> ${VERSION}"

  ci-gate:
    name: CI gate
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features --workspace

      - name: Verify Cargo.toml version matches tag
        run: |
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['packages'][0]['version'])")
          TAG_VERSION="${{ needs.validate-tag.outputs.version }}"
          if [[ "${CARGO_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "::error::Cargo.toml version (${CARGO_VERSION}) does not match tag (${TAG_VERSION})"
            exit 1
          fi
          echo "Version match confirmed: ${CARGO_VERSION}"

  build:
    name: Build ${{ matrix.target }}
    needs: [validate-tag, ci-gate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            artifact_name: cargo-cicd
            asset_name: cargo-cicd-linux-x86_64-musl

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            artifact_name: cargo-cicd
            asset_name: cargo-cicd-linux-x86_64-gnu

          - target: x86_64-apple-darwin
            os: macos-13
            use_cross: false
            artifact_name: cargo-cicd
            asset_name: cargo-cicd-macos-x86_64

          - target: aarch64-apple-darwin
            os: macos-14
            use_cross: false
            artifact_name: cargo-cicd
            asset_name: cargo-cicd-macos-aarch64

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            artifact_name: cargo-cicd.exe
            asset_name: cargo-cicd-windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (Linux musl)
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build with cross
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build native
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" \
             "dist/${{ matrix.asset_name }}"

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.artifact_name }}" `
                    "dist\${{ matrix.asset_name }}.exe"

      - name: Generate SHA256 checksum (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          sha256sum "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          cat "${{ matrix.asset_name }}.sha256"

      - name: Generate SHA256 checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd dist
          $hash = (Get-FileHash "${{ matrix.asset_name }}.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset_name }}.exe" | Out-File -Encoding ASCII "${{ matrix.asset_name }}.exe.sha256"
          Get-Content "${{ matrix.asset_name }}.exe.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/
          retention-days: 1

  create-release:
    name: Create GitHub Release
    needs: [validate-tag, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Flatten artifact directories
        run: |
          mkdir -p release-assets
          find artifacts/ -type f -exec cp {} release-assets/ \;
          echo "Release assets:"
          ls -lh release-assets/

      - name: Merge checksums into single file
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
          echo "SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Extract changelog excerpt
        id: changelog
        run: |
          VERSION="${{ needs.validate-tag.outputs.version }}"

          # Extract the section for this version from CHANGELOG.md
          if [[ -f CHANGELOG.md ]]; then
            # Find the block between this version header and the next
            EXCERPT=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
            if [[ -z "${EXCERPT}" ]]; then
              EXCERPT="See commit history for changes in this release."
            fi
          else
            EXCERPT="See commit history for changes in this release."
          fi

          # Write to file to avoid quoting issues
          echo "${EXCERPT}" > /tmp/changelog_excerpt.md

          # Also build a git-log summary as fallback/supplement
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [[ -n "${PREV_TAG}" ]]; then
            echo "" >> /tmp/changelog_excerpt.md
            echo "### Commits since ${PREV_TAG}" >> /tmp/changelog_excerpt.md
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" >> /tmp/changelog_excerpt.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release v${{ needs.validate-tag.outputs.version }}"
          body_path: /tmp/changelog_excerpt.md
          draft: false
          prerelease: false
          files: |
            release-assets/*
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: false
