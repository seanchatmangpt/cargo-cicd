name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# ---------------------------------------------------------------------------
# Job 1: validate-tag
# Ensures the tag is strict semver and that src/Cargo.toml agrees on version.
# All downstream jobs gate on this one.
# ---------------------------------------------------------------------------
jobs:
  validate-tag:
    name: Validate tag and Cargo.toml version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse and validate tag
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"

          # Enforce strict vMAJOR.MINOR.PATCH format
          if [[ ! "${TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error title=Bad tag format::Tag '${TAG}' does not match vX.Y.Z — re-tag with the correct format and re-push."
            exit 1
          fi

          VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Tag validated: ${TAG} -> ${VERSION}"

      - name: Verify Cargo.toml version matches tag
        run: |
          VERSION="${{ steps.parse.outputs.version }}"

          if ! grep -qE "^version = \"${VERSION}\"" src/Cargo.toml; then
            CARGO_VER=$(grep -m1 '^version' src/Cargo.toml | cut -d'"' -f2)
            echo "::error title=Version mismatch::src/Cargo.toml has version '${CARGO_VER}' but tag is 'v${VERSION}'."
            echo "::error::Fix: update src/Cargo.toml to version = \"${VERSION}\", commit, then re-tag."
            exit 1
          fi

          echo "Cargo.toml version confirmed: ${VERSION}"

# ---------------------------------------------------------------------------
# Job 2: build
# Cross-compiles for all 5 target triples and produces per-target tarballs /
# zips plus individual .sha256 sidecar files.
# Hashes are also surfaced as a job output (base64) for SLSA provenance.
# ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }}
    needs: validate-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            use_cross: true
            archive: tar

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            use_cross: true
            archive: tar

          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
            use_cross: false
            archive: tar

          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
            use_cross: false
            archive: tar

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
            use_cross: false
            archive: zip

    outputs:
      # Populated by the checksums job (see below); declared here for SLSA wiring.
      hashes: ${{ steps.export-hashes.outputs.hashes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ---- Linux musl: use `cross` so we get a static musl libc ----
      - name: Install cross (Linux musl targets)
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build (cross — Linux musl)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} --bin cargo-project

      # ---- macOS / Windows: native cargo ----
      - name: Build (cargo — macOS / Windows)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }} --bin cargo-project

      # ---- Package: tar.gz for Unix ----
      - name: Package (tar.gz — Unix)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          VERSION="${{ needs.validate-tag.outputs.version }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="cargo-project-${VERSION}-${TARGET}.tar.gz"

          tar czf "${ARCHIVE}" \
            -C "target/${TARGET}/release" \
            "cargo-project"

          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          echo "ARCHIVE=${ARCHIVE}" >> "${GITHUB_ENV}"

      # ---- Package: zip for Windows ----
      - name: Package (zip — Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $VERSION = "${{ needs.validate-tag.outputs.version }}"
          $TARGET  = "${{ matrix.target }}"
          $ARCHIVE = "cargo-project-${VERSION}-${TARGET}.zip"

          Compress-Archive `
            -Path "target\${TARGET}\release\cargo-project.exe" `
            -DestinationPath $ARCHIVE

          $hash = (Get-FileHash $ARCHIVE -Algorithm SHA256).Hash.ToLower()
          "$hash  $ARCHIVE" | Out-File -Encoding ASCII "${ARCHIVE}.sha256"

          echo "ARCHIVE=$ARCHIVE" >> $env:GITHUB_ENV

      - name: Export per-target hash (Unix)
        if: runner.os != 'Windows'
        id: export-hashes
        shell: bash
        run: |
          # Surface as a step output so the checksums job can aggregate them.
          HASH=$(cat "${ARCHIVE}.sha256")
          echo "hashes=${HASH}" >> "${GITHUB_OUTPUT}"

      - name: Export per-target hash (Windows)
        if: runner.os == 'Windows'
        id: export-hashes-win
        shell: pwsh
        run: |
          $hash = Get-Content "${env:ARCHIVE}.sha256"
          echo "hashes=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload archive artefact
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          retention-days: 1
          if-no-files-found: error

# ---------------------------------------------------------------------------
# Job 3: checksums
# Downloads every per-target artefact, concatenates the .sha256 sidecars into
# a single checksums.sha256, and re-uploads it.  Also base64-encodes the full
# checksum set for the SLSA provenance job.
# ---------------------------------------------------------------------------
  checksums:
    name: Aggregate checksums
    needs: build
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.b64.outputs.hashes }}
    steps:
      - name: Download all build artefacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts/

      - name: Collect archives and checksums
        run: |
          mkdir -p release-files
          # Flatten directory tree created by download-artifact
          find all-artifacts/ -type f | while read -r f; do
            cp "$f" release-files/
          done
          echo "Release files:"
          ls -lh release-files/

      - name: Generate checksums.sha256
        run: |
          cd release-files
          # Concatenate individual .sha256 sidecar files into one manifest
          cat *.sha256 | sort > checksums.sha256
          echo "checksums.sha256:"
          cat checksums.sha256

      - name: Base64-encode checksums for SLSA
        id: b64
        run: |
          HASHES=$(base64 -w0 release-files/checksums.sha256)
          echo "hashes=${HASHES}" >> "${GITHUB_OUTPUT}"

      - name: Upload checksums artefact
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: release-files/checksums.sha256
          retention-days: 1
          if-no-files-found: error

# ---------------------------------------------------------------------------
# Job 4: create-release
# Extracts the CHANGELOG section for this version, creates the GitHub Release,
# and attaches all archives plus checksums.sha256.
# ---------------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    needs: [build, checksums]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: all-artifacts/
          merge-multiple: true

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: checksums
          path: all-artifacts/

      - name: Extract CHANGELOG section
        id: changelog
        run: |
          VERSION="${{ needs.validate-tag.outputs.version }}"

          if [[ -f CHANGELOG.md ]]; then
            python3 - <<'PYEOF'
          import re, sys, os

          version = os.environ["VERSION"]
          text    = open("CHANGELOG.md").read()

          # Find the heading for this version; heading may use [X.Y.Z] or plain X.Y.Z
          start_pat = re.compile(
              r'^##\s+\[?' + re.escape(version) + r'\]?',
              re.MULTILINE
          )
          end_pat   = re.compile(r'^##\s+\[', re.MULTILINE)

          m = start_pat.search(text)
          if not m:
              body = "See commit history for changes in this release."
          else:
              rest  = text[m.end():]
              end_m = end_pat.search(rest)
              body  = rest[:end_m.start()].strip() if end_m else rest.strip()
              if not body:
                  body = "See commit history for changes in this release."

          with open("/tmp/release_body.md", "w") as f:
              f.write(body + "\n")
          PYEOF
          else
            echo "See commit history for changes in this release." > /tmp/release_body.md
          fi

          echo "Release body:"
          cat /tmp/release_body.md
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "cargo-project ${{ github.ref_name }}"
          body_path: /tmp/release_body.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            all-artifacts/*.tar.gz
            all-artifacts/*.zip
            all-artifacts/checksums.sha256
          token: ${{ secrets.GITHUB_TOKEN }}

# ---------------------------------------------------------------------------
# Job 5: provenance (SLSA level 3)
# Uses the official SLSA GitHub Generator to produce a signed provenance
# attestation for the release binaries.  Must run after build so it can
# consume the base64-encoded checksum hashes.
# ---------------------------------------------------------------------------
  provenance:
    name: SLSA provenance
    needs: [checksums, create-release]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.checksums.outputs.hashes }}"
      upload-assets: true
