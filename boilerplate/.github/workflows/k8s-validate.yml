# =============================================================================
# k8s-validate.yml — Kubernetes manifest validation
#
# Triggers:
#   pull_request affecting kubernetes/**
#   push to main affecting kubernetes/**
#
# Jobs:
#   1. kubeval   — API-version correctness (schema validation)
#   2. kube-lint — Security and best-practice checks (kube-linter)
#   3. manifest-diff — Structured YAML diff on PRs (via yq)
# =============================================================================

name: Kubernetes Manifest Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'kubernetes/**'
  push:
    branches:
      - main
    paths:
      - 'kubernetes/**'

permissions:
  contents: read
  # Required for uploading kube-linter SARIF results
  security-events: write
  # Required for posting PR diff comments
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # kubeval — validate manifest apiVersion + schema conformance
  # ---------------------------------------------------------------------------
  kubeval:
    name: kubeval (schema validation)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install kubeval from the official release binary.
      # Pin to a specific version for reproducibility.
      - name: Install kubeval
        run: |
          KUBEVAL_VERSION="0.16.1"
          curl -sSLo /tmp/kubeval.tar.gz \
            "https://github.com/instrumenta/kubeval/releases/download/v${KUBEVAL_VERSION}/kubeval-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeval.tar.gz -C /tmp
          sudo install -m 0755 /tmp/kubeval /usr/local/bin/kubeval
          kubeval --version

      - name: Validate Kubernetes manifests
        run: |
          set -euo pipefail
          if ! ls kubernetes/*.yaml 2>/dev/null; then
            echo "No YAML files found in kubernetes/ — nothing to validate."
            exit 0
          fi
          kubeval \
            --strict \
            --ignore-missing-schemas \
            --kubernetes-version 1.29.0 \
            kubernetes/*.yaml
        env:
          # kubeval can cache schemas; use the GitHub Actions temp dir.
          KUBEVAL_SCHEMA_LOCATION: /tmp/kubeval-schemas

  # ---------------------------------------------------------------------------
  # kube-lint — security and operational best-practice checks
  # ---------------------------------------------------------------------------
  kube-lint:
    name: kube-linter (security & best practices)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # kube-linter-action runs the linter and optionally produces SARIF output.
      # Checks enabled below cover the most impactful security controls:
      #   no-read-only-root-fs    → containers should have readOnlyRootFilesystem
      #   run-as-non-root         → containers must not run as UID 0
      #   resource-limits         → CPU and memory limits must be set
      #   no-extensions-v1beta1   → deprecated API group usage
      #   privilege-escalation-container → allowPrivilegeEscalation must be false
      - name: Run kube-linter
        uses: stackrox/kube-linter-action@v1
        with:
          directory: kubernetes/
          # Inline config — avoids needing a separate .kube-linter.yaml file.
          config: |
            checks:
              addAllBuiltIn: false
              include:
                - "no-read-only-root-fs"
                - "run-as-non-root"
                - "resource-limits"
                - "no-extensions-v1beta1"
                - "privilege-escalation-container"
                - "drop-net-raw-capability"
                - "latest-tag"
                - "no-liveness-probe"
                - "no-readiness-probe"
          # Emit SARIF for the Security tab; also print results to the log.
          format: sarif
          output-file: kube-linter-results.sarif

      - name: Upload kube-linter SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: kube-linter-results.sarif
          category: kube-linter

  # ---------------------------------------------------------------------------
  # manifest-diff — show a structured YAML diff on PRs
  # Runs only on pull_request events so the step has a base ref to diff against.
  # ---------------------------------------------------------------------------
  manifest-diff:
    name: Manifest diff (PR only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout PR base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base

      # Install yq — a lightweight YAML processor used to produce a normalised
      # diff (keys sorted, no comment noise) so structural changes stand out.
      - name: Install yq
        run: |
          YQ_VERSION="v4.44.1"
          curl -sSLo /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x /usr/local/bin/yq
          yq --version

      - name: Generate normalised YAML diff
        id: diff
        run: |
          set -euo pipefail

          BASE_DIR="base/kubernetes"
          HEAD_DIR="head/kubernetes"

          # Normalise each YAML file (sort keys, strip comments) so that the
          # diff reflects structural changes rather than formatting noise.
          normalise() {
            local dir="$1"
            local out="$2"
            mkdir -p "$out"
            for f in "$dir"/*.yaml 2>/dev/null; do
              [ -f "$f" ] || continue
              yq 'sort_keys(..)' "$f" > "$out/$(basename "$f")"
            done
          }

          normalise "$BASE_DIR" /tmp/base-norm
          normalise "$HEAD_DIR" /tmp/head-norm

          DIFF_OUTPUT=$(diff -rU 5 /tmp/base-norm /tmp/head-norm || true)

          if [ -z "$DIFF_OUTPUT" ]; then
            DIFF_OUTPUT="No structural changes detected in kubernetes/*.yaml"
          fi

          # Write to GITHUB_OUTPUT using the EOF delimiter for multi-line values.
          echo "diff<<EOF_DIFF" >> "$GITHUB_OUTPUT"
          echo "$DIFF_OUTPUT"   >> "$GITHUB_OUTPUT"
          echo "EOF_DIFF"       >> "$GITHUB_OUTPUT"

      # Post the diff as a collapsible PR comment so reviewers see it inline.
      - name: Post diff as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const diff = `${{ steps.diff.outputs.diff }}`;
            const body = [
              '### Kubernetes manifest diff',
              '',
              'Normalised YAML diff (keys sorted, comments stripped):',
              '',
              '```diff',
              diff,
              '```',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
