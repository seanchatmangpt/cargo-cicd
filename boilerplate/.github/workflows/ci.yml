name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "*.txt"
      - "LICENSE*"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "*.txt"
      - "LICENSE*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  NEXTEST_PROFILE: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Formatting — no cache needed, rustfmt is fast
  # ────────────────────────────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ────────────────────────────────────────────────────────────────────────────
  # Lint — all features so gated code paths are not missed
  # ────────────────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: clippy-stable-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ────────────────────────────────────────────────────────────────────────────
  # Tests — stable on three OSes + beta on Linux for early regression detection
  #
  # Matrix:
  #   {os: ubuntu-latest, toolchain: stable}
  #   {os: macos-latest,  toolchain: stable}
  #   {os: windows-latest, toolchain: stable}
  #   {os: ubuntu-latest, toolchain: beta}   ← catches upcoming breakage early
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests (${{ matrix.os }} / ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
          - os: macos-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable
          - os: ubuntu-latest
            toolchain: beta
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ${{ matrix.toolchain }} toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked

      - name: Run test suite (nextest)
        run: cargo nextest run --workspace --all-features

      - name: Run doc tests
        run: cargo test --doc --workspace

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-${{ matrix.toolchain }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  # Feature powerset — cargo-hack exhaustively checks all flag combinations
  # up to depth 2, catching missing #[cfg] guards and bad feature interactions
  # ────────────────────────────────────────────────────────────────────────────
  features:
    name: Feature powerset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-stable-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-hack
        run: cargo install cargo-hack --locked

      - name: Check feature powerset (depth 2)
        run: cargo hack check --workspace --feature-powerset --depth 2 --optional-deps

  # ────────────────────────────────────────────────────────────────────────────
  # MSRV — compile with the minimum supported Rust version, default features
  # only (MSRV compatibility is not required for optional/advanced flags)
  # ────────────────────────────────────────────────────────────────────────────
  msrv:
    name: MSRV (1.86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.86

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-1.86-${{ hashFiles('**/Cargo.lock') }}

      - name: Check workspace on MSRV
        run: cargo check --workspace --all-targets

  # ────────────────────────────────────────────────────────────────────────────
  # Documentation — deny rustdoc warnings with all features enabled
  # ────────────────────────────────────────────────────────────────────────────
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-stable-${{ hashFiles('**/Cargo.lock') }}

      - name: Build docs (deny warnings, all features)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features

  # ────────────────────────────────────────────────────────────────────────────
  # Required summary gate — PRs should require only this single job
  # so that adding new parallel jobs never breaks existing branch protection
  # ────────────────────────────────────────────────────────────────────────────
  ci:
    name: CI
    if: always()
    needs: [fmt, clippy, test, features, msrv, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          if echo "$results" | grep -q '"result": "failure"'; then
            echo "One or more required jobs failed."
            exit 1
          fi
          if echo "$results" | grep -q '"result": "cancelled"'; then
            echo "One or more required jobs were cancelled."
            exit 1
          fi
          echo "All checks passed."
