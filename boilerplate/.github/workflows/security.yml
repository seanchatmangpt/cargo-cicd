name: Security Audit

on:
  push:
    branches:
      - main
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - 'deny.toml'
      - '.github/workflows/security.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - 'deny.toml'
  schedule:
    # Weekly on Monday at 08:00 UTC
    - cron: '0 8 * * 1'

permissions:
  contents: read
  security-events: write

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: |
          cargo audit \
            --deny warnings \
            --deny unsound \
            --deny yanked \
            --color always \
            2>&1 | tee audit-report.txt

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: audit-report.txt
          retention-days: 30

  cargo-deny:
    name: cargo deny (licenses + bans + advisories)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Will use deny.toml if present; falls back to sensible defaults
          command: check
          arguments: --all-features
          # Check all four categories
          log-level: warn
          manifest-path: Cargo.toml

  gitleaks:
    name: Gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Scan full history for secrets
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: GITLEAKS_LICENSE if using org-level scanning
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          args: >-
            --redact
            --verbose
            --exit-code=1

  dependency-license-check:
    name: Dependency license check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check licenses
        run: |
          # Create a minimal deny.toml if one does not exist
          if [[ ! -f deny.toml ]]; then
            cat > /tmp/deny-licenses-only.toml << 'TOML'
          [licenses]
          # Allow common permissive and weak copyleft licenses
          allow = [
            "MIT",
            "Apache-2.0",
            "Apache-2.0 WITH LLVM-exception",
            "BSD-2-Clause",
            "BSD-3-Clause",
            "ISC",
            "Unicode-DFS-2016",
            "Zlib",
            "CC0-1.0",
            "OpenSSL",
          ]
          deny = [
            "GPL-2.0",
            "GPL-3.0",
            "LGPL-2.0",
            "LGPL-2.1",
            "LGPL-3.0",
            "AGPL-3.0",
          ]
          copyleft = "deny"
          allow-osi-fsf-free = "neither"
          default = "deny"
          confidence-threshold = 0.8

          [advisories]
          # Ignore - handled by cargo-audit job above
          ignore = []

          [bans]
          multiple-versions = "warn"
          TOML
            DENY_CONFIG="/tmp/deny-licenses-only.toml"
          else
            DENY_CONFIG="deny.toml"
          fi

          cargo deny --config "${DENY_CONFIG}" check licenses 2>&1 | tee license-report.txt
          echo "Exit code: $?"

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-check-report
          path: license-report.txt
          retention-days: 30

  supply-chain-summary:
    name: Supply chain summary
    runs-on: ubuntu-latest
    needs: [cargo-audit, cargo-deny, gitleaks, dependency-license-check]
    if: always()
    steps:
      - name: Report overall status
        run: |
          echo "## Supply Chain Security Summary" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Check | Status |" >> "${GITHUB_STEP_SUMMARY}"
          echo "|-------|--------|" >> "${GITHUB_STEP_SUMMARY}"

          STATUS_AUDIT="${{ needs.cargo-audit.result }}"
          STATUS_DENY="${{ needs.cargo-deny.result }}"
          STATUS_GITLEAKS="${{ needs.gitleaks.result }}"
          STATUS_LICENSE="${{ needs.dependency-license-check.result }}"

          icon() {
            case "$1" in
              success) echo ":white_check_mark: passed" ;;
              failure) echo ":x: FAILED" ;;
              cancelled) echo ":grey_question: cancelled" ;;
              skipped) echo ":white_circle: skipped" ;;
              *) echo ":grey_question: unknown" ;;
            esac
          }

          echo "| cargo audit (RustSec) | $(icon ${STATUS_AUDIT}) |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| cargo deny (licenses/bans) | $(icon ${STATUS_DENY}) |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Gitleaks (secrets) | $(icon ${STATUS_GITLEAKS}) |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| License check | $(icon ${STATUS_LICENSE}) |" >> "${GITHUB_STEP_SUMMARY}"

          # Fail the summary job if any check failed
          if [[ "${STATUS_AUDIT}" == "failure" ]] || \
             [[ "${STATUS_DENY}" == "failure" ]] || \
             [[ "${STATUS_GITLEAKS}" == "failure" ]] || \
             [[ "${STATUS_LICENSE}" == "failure" ]]; then
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            echo "> :rotating_light: One or more security checks failed." >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
