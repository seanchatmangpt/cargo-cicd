# =============================================================================
# compose-validate.yml — Docker Compose and Dockerfile validation
#
# Triggers:
#   pull_request affecting docker-compose*.yml or Dockerfile*
#
# Steps:
#   1. docker compose config — syntax validation
#   2. docker build --no-cache (smoke build, confirms Dockerfile is parseable)
#   3. hadolint            — Dockerfile lint (SARIF → Security tab)
# =============================================================================

name: Docker Compose Validation

on:
  pull_request:
    paths:
      - 'docker-compose*.yml'
      - 'Dockerfile*'

permissions:
  contents: read
  # Required for uploading hadolint SARIF results to the Security tab
  security-events: write

jobs:
  # ---------------------------------------------------------------------------
  # compose-config — validate docker-compose.yml syntax
  # ---------------------------------------------------------------------------
  compose-config:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `docker compose config` resolves environment variable substitutions,
      # merges override files, and validates the Compose file schema.  It exits
      # non-zero on any syntax or reference error.
      - name: Validate Compose file syntax
        run: |
          docker compose config --quiet
        env:
          # Supply placeholder values so variable substitution does not fail on
          # required variables that are normally sourced from a .env file.
          BUILD_DATE: "1970-01-01T00:00:00Z"
          GIT_COMMIT: "0000000"
          VERSION: "dev"
          APP_PORT: "8080"
          RUST_LOG: "info"
          DATABASE_URL: "sqlite:///data/app.db"

  # ---------------------------------------------------------------------------
  # dockerfile-build — verify the Dockerfile is parseable and builds cleanly
  # ---------------------------------------------------------------------------
  dockerfile-build:
    name: Dockerfile smoke build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build without pushing and without using a registry cache so the
      # Dockerfile is fully re-evaluated.  `--no-cache` is intentional here:
      # this job validates the Dockerfile itself, not the cached layer chain.
      # The `--load` flag is omitted for multi-platform builds; using
      # `--output type=cacheonly` avoids loading the image into the daemon
      # (saves disk I/O) while still running every build stage.
      - name: Dry-run build (all stages, amd64 only)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --no-cache \
            --output type=cacheonly \
            --build-arg CARGO_VERSION=pr-check \
            .

  # ---------------------------------------------------------------------------
  # hadolint — lint the Dockerfile for best practices
  # ---------------------------------------------------------------------------
  hadolint:
    name: Hadolint Dockerfile lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # hadolint-action runs the linter and emits a SARIF file.
      # Ignored rules:
      #   DL3008 — pin apt-get package versions:
      #             Rust dockerfiles typically use distroless/cargo-chef base
      #             images where apt-get is not called; this rule is noise.
      #   DL3009 — delete apt-get lists:
      #             Paired with DL3008 — same reasoning.
      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008,DL3009
          # Emit SARIF so findings appear in the Security tab.
          format: sarif
          output-file: hadolint-results.sarif
          # Do not fail the step on warnings — the SARIF upload will surface
          # them without blocking the PR merge unnecessarily.
          failure-threshold: error

      - name: Upload hadolint SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: hadolint-results.sarif
          category: hadolint
