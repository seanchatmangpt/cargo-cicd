name: Cross-target Check

# Run on PRs that touch Rust source or crate manifests.
# This is a fast "does it compile?" gate — no binary is produced.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # check
  # Runs `cargo check` (or `cross check`) for every target triple.
  # Fast: type-checks all crates but never links a binary.
  # ---------------------------------------------------------------------------
  check:
    name: Check ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false

          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true

          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false

          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and check artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Check (cross)
        if: matrix.use_cross
        run: cross check --target ${{ matrix.target }} --workspace

      - name: Check (cargo)
        if: "!matrix.use_cross"
        run: cargo check --target ${{ matrix.target }} --workspace

  # ---------------------------------------------------------------------------
  # gate
  # Single required status check that GitHub branch protection can reference.
  # Passes only when every matrix leg above passes.
  # ---------------------------------------------------------------------------
  gate:
    name: Cross-check gate
    needs: check
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All targets passed
        run: |
          if [[ "${{ needs.check.result }}" != "success" ]]; then
            echo "::error::One or more cross-check targets failed. See the 'check' job matrix above."
            exit 1
          fi
          echo "All cross-check targets passed."
