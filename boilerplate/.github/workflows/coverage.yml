name: Code Coverage

on:
  pull_request:
    branches:
      - main
    # Only run when source code or test files change
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - '.github/workflows/coverage.yml'

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Minimum acceptable coverage percentage
  COVERAGE_THRESHOLD: 60

jobs:
  coverage:
    name: Measure coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Run tarpaulin
        run: |
          cargo tarpaulin \
            --all-features \
            --workspace \
            --timeout 120 \
            --out Xml \
            --out Json \
            --out Html \
            --output-dir coverage/ \
            --exclude-files 'tests/*' \
            --exclude-files 'benches/*' \
            --exclude-files 'build.rs' \
            -- --test-threads 1
        env:
          CARGO_INCREMENTAL: '0'
          RUSTFLAGS: '-Copt-level=0'

      - name: Extract coverage percentage
        id: coverage
        run: |
          # Parse the JSON output from tarpaulin
          if [[ -f coverage/tarpaulin-report.json ]]; then
            PCT=$(python3 - << 'PYEOF'
          import json, sys
          with open("coverage/tarpaulin-report.json") as f:
              data = json.load(f)
          # tarpaulin JSON has a "coverage" key at top level (0.0-100.0)
          cov = data.get("coverage", 0.0)
          print(f"{cov:.2f}")
          PYEOF
            )
          else
            # Fallback: parse from XML cobertura report
            PCT=$(python3 - << 'PYEOF'
          import xml.etree.ElementTree as ET
          tree = ET.parse("coverage/cobertura.xml")
          root = tree.getroot()
          rate = float(root.attrib.get("line-rate", "0"))
          print(f"{rate * 100:.2f}")
          PYEOF
            )
          fi

          echo "percentage=${PCT}" >> "${GITHUB_OUTPUT}"
          echo "Coverage: ${PCT}%"

      - name: Enforce coverage threshold
        run: |
          PCT="${{ steps.coverage.outputs.percentage }}"
          THRESHOLD="${COVERAGE_THRESHOLD}"

          echo "Measured coverage: ${PCT}%"
          echo "Required threshold: ${THRESHOLD}%"

          # Use python for float comparison (bash can't do floats)
          python3 -c "
          pct = float('${PCT}')
          threshold = float('${THRESHOLD}')
          if pct < threshold:
              print(f'FAIL: {pct:.2f}% < {threshold}% minimum')
              raise SystemExit(1)
          else:
              print(f'PASS: {pct:.2f}% >= {threshold}% minimum')
          "

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/cobertura.xml
          flags: unittests
          name: cargo-cicd-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: coverage/tarpaulin-report.html
          retention-days: 7

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const pct = parseFloat('${{ steps.coverage.outputs.percentage }}');
            const threshold = parseInt('${{ env.COVERAGE_THRESHOLD }}');
            const status = pct >= threshold ? '✅ PASS' : '❌ FAIL';
            const emoji = pct >= threshold ? '📈' : '📉';

            const body = [
              `## ${emoji} Code Coverage Report`,
              '',
              `| Metric | Value |`,
              `|--------|-------|`,
              `| Coverage | **${pct.toFixed(2)}%** |`,
              `| Threshold | ${threshold}% |`,
              `| Status | ${status} |`,
              '',
              pct >= threshold
                ? `Coverage is above the ${threshold}% minimum threshold.`
                : `⚠️ Coverage dropped below the ${threshold}% minimum threshold. Please add tests.`,
              '',
              `> Full HTML report available in workflow artifacts.`,
            ].join('\n');

            // Find existing bot comment to update instead of spamming
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Code Coverage Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
