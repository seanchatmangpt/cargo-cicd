name: Code Coverage

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'crates/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - '.github/workflows/coverage.yml'

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  COVERAGE_THRESHOLD: 60

jobs:
  coverage:
    name: Measure coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Run tarpaulin
        run: |
          cargo tarpaulin \
            --workspace \
            --features "process-data autonomic" \
            --timeout 180 \
            --out Xml Lcov Html \
            --output-dir target/coverage \
            --exclude-files "*/main.rs" \
            --exclude-files "tests/*" \
            --exclude-files "benches/*" \
            --exclude-files "build.rs" \
            -- --test-threads 1
        env:
          CARGO_INCREMENTAL: '0'
          RUSTFLAGS: '-Copt-level=0'

      - name: Parse coverage percentage
        id: coverage
        run: |
          PCT=$(python3 - <<'PYEOF'
          import xml.etree.ElementTree as ET, sys
          tree = ET.parse("target/coverage/cobertura.xml")
          root = tree.getroot()
          rate = float(root.attrib.get("line-rate", "0"))
          print(f"{rate * 100:.2f}")
          PYEOF
          )
          echo "percentage=${PCT}" >> "${GITHUB_OUTPUT}"
          echo "Coverage: ${PCT}%"

      - name: Enforce coverage threshold
        run: |
          python3 - <<PYEOF
          pct = float("${{ steps.coverage.outputs.percentage }}")
          threshold = float("${{ env.COVERAGE_THRESHOLD }}")
          if pct < threshold:
              print(f"FAIL: {pct:.2f}% < {threshold}% minimum required")
              raise SystemExit(1)
          print(f"PASS: {pct:.2f}% >= {threshold}% minimum")
          PYEOF

      - name: Upload LCOV to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: target/coverage/lcov.info
          flags: unittests
          name: workspace-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: target/coverage/tarpaulin-report.html
          retention-days: 14

      - name: Post coverage comment on PR
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            ## Code Coverage Report

            | Metric    | Value                                         |
            |-----------|-----------------------------------------------|
            | Coverage  | **${{ steps.coverage.outputs.percentage }}%** |
            | Threshold | ${{ env.COVERAGE_THRESHOLD }}%                |

            Full HTML report available in workflow artifacts: `coverage-report-${{ github.sha }}`.
          comment_tag: coverage-report
          mode: upsert
