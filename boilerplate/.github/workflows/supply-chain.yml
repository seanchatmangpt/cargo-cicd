name: Supply Chain Security

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - 'deny.toml'
      - '.cargo/config.toml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - 'deny.toml'
      - '.cargo/config.toml'
  schedule:
    # Daily at 06:00 UTC — catches new advisories
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit --deny warnings

  deny:
    name: Deny (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all
          arguments: --config deny.toml

  licenses:
    name: License SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check licenses
        run: cargo deny check licenses

      - name: Generate SBOM (SPDX)
        run: |
          cargo install cargo-sbom --locked 2>/dev/null || true
          if command -v cargo-sbom &>/dev/null; then
            cargo sbom > sbom.spdx.json
          fi

      - name: Upload SBOM
        if: hashFiles('sbom.spdx.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 90

  secrets-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  udeps:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          key: udeps-${{ runner.os }}

      - name: Install cargo-udeps
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-udeps

      - name: Check for unused deps
        run: cargo +nightly udeps --all-targets --workspace

  supply-chain-gate:
    name: Supply Chain Gate
    needs: [audit, deny, licenses, secrets-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all supply-chain jobs passed
        run: |
          if [[ "${{ needs.audit.result }}" != "success" || \
                "${{ needs.deny.result }}" != "success" || \
                "${{ needs.licenses.result }}" != "success" || \
                "${{ needs.secrets-scan.result }}" != "success" ]]; then
            echo "One or more supply-chain checks failed"
            exit 1
          fi
          echo "All supply-chain checks passed"
