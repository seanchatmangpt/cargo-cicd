name: Fuzz Smoke Tests

on:
  schedule:
    # Every day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  fuzz:
    name: cargo-fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Non-blocking — fuzzing surfaces new crash inputs but should not gate PRs.
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        # Keep this list in sync with fuzz/Cargo.toml [[bin]] entries.
        target:
          - parse_verdict
          - parse_workspace_id
          - core_error_display

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check fuzz directory exists
        id: fuzz_check
        run: |
          if [[ -d fuzz/fuzz_targets ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::fuzz/ directory not found — skipping fuzz run."
          fi

      - name: Install Rust (nightly)
        if: steps.fuzz_check.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry
        if: steps.fuzz_check.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-fuzz-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-${{ matrix.target }}-

      - name: Install cargo-fuzz
        if: steps.fuzz_check.outputs.present == 'true'
        run: cargo install cargo-fuzz --locked

      - name: Run fuzz target — ${{ matrix.target }}
        if: steps.fuzz_check.outputs.present == 'true'
        # 30-second smoke run: long enough to find obvious panics, short enough
        # to keep the daily budget minimal.  max_len caps input size so the
        # fuzzer stays focused on realistic inputs.
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} \
            -- \
            -max_total_time=30 \
            -max_len=4096

      - name: Upload crash artifacts — ${{ matrix.target }}
        if: steps.fuzz_check.outputs.present == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}-${{ github.run_number }}
          # Crash inputs are written to fuzz/artifacts/<target>/ by libFuzzer.
          path: fuzz/artifacts/${{ matrix.target }}/
          retention-days: 90
          if-no-files-found: ignore
