name: Mark Stale Issues and PRs

on:
  schedule:
    - cron: '0 1 * * *'

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest

    steps:
      - name: Mark stale issues and pull requests
        uses: actions/stale@v9
        with:
          # Issues
          days-before-issue-stale: 60
          days-before-issue-close: 7
          stale-issue-label: stale
          stale-issue-message: >
            This issue has been inactive for 60 days. It will be closed in 7
            days unless there is activity.
          close-issue-message: >
            Closing due to inactivity. Reopen if still relevant.
          exempt-issue-labels: pinned,security,enhancement

          # Pull requests
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: stale
          stale-pr-message: >
            This pull request has been inactive for 30 days. It will be closed
            in 14 days unless there is activity.
          close-pr-message: >
            Closing due to inactivity. Reopen if still relevant.
          exempt-pr-labels: do-not-merge,work-in-progress

          repo-token: ${{ secrets.GITHUB_TOKEN }}
