name: Mutation Testing

on:
  schedule:
    # Every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  mutants:
    name: cargo-mutants
    runs-on: ubuntu-latest
    # Non-blocking — a low mutation score is informational, not a build break.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mutants-

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Run mutation testing
        # Hard wall at 1 hour so a runaway job cannot consume unlimited CI minutes.
        timeout-minutes: 60
        run: |
          mkdir -p target/mutants
          cargo mutants \
            --workspace \
            --timeout 60 \
            --jobs 4 \
            --output target/mutants \
            2>&1 | tee target/mutants-summary.txt

      - name: Post mutation summary to step summary
        if: always()
        run: |
          if [[ -f target/mutants/summary.json ]]; then
            python3 - <<'PYEOF'
          import json, os
          with open("target/mutants/summary.json") as f:
              data = json.load(f)
          caught = data.get("caught", 0)
          missed = data.get("missed", 0)
          timeout = data.get("timeout", 0)
          total = caught + missed + timeout
          score = (caught / total * 100) if total > 0 else 0
          summary = f"""## Mutation Testing Results
          | Metric | Count |
          |--------|-------|
          | Caught | {caught} |
          | Missed | {missed} |
          | Timeout | {timeout} |
          | Score | {score:.1f}% |
          """
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary)
          PYEOF
          else
            echo "## Mutation Testing Results" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No summary.json found — mutation run may have failed or been cancelled." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload mutation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ github.run_number }}
          # Upload the structured JSON summary and per-outcome directories.
          path: |
            target/mutants/summary.json
            target/mutants/caught/
            target/mutants/missed/
            target/mutants/timeout/
            target/mutants-summary.txt
          # Keep mutation reports for 30 days.
          retention-days: 30
          # Do not fail the upload step if some sub-paths are absent.
          if-no-files-found: warn
