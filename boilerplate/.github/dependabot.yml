version: 2

updates:
  # ---------------------------------------------------------------------------
  # Rust / Cargo dependencies
  # ---------------------------------------------------------------------------
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"

    open-pull-requests-limit: 5

    groups:
      # Group all patch updates together into a single PR per week
      patch-updates:
        update-types:
          - "patch"

    assignees:
      - "seanchatmangpt"

    labels:
      - "dependencies"
      - "automated"

    commit-message:
      prefix: "deps"
      include: "scope"

    rebase-strategy: "auto"

    ignore:
      # clap and tokio major version bumps require manual review
      - dependency-name: "clap"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tokio"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"

    open-pull-requests-limit: 5

    groups:
      # Auto-merge patch and minor action updates together
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    assignees:
      - "seanchatmangpt"

    labels:
      - "dependencies"
      - "automated"

    commit-message:
      prefix: "ci"
      include: "scope"

    rebase-strategy: "auto"

  # ---------------------------------------------------------------------------
  # Docker
  # ---------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"

    open-pull-requests-limit: 5

    assignees:
      - "seanchatmangpt"

    labels:
      - "dependencies"
      - "automated"

    commit-message:
      prefix: "docker"
      include: "scope"

    rebase-strategy: "auto"
