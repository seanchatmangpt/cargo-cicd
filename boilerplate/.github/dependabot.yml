version: 2

updates:
  # ---------------------------------------------------------------------------
  # Rust / Cargo dependencies
  # ---------------------------------------------------------------------------
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"

    # Open at most 5 PRs at a time for Cargo updates
    open-pull-requests-limit: 5

    # Separate production and development dependency updates
    groups:
      # Dev dependencies (test, bench, example crates) in one PR per week
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

      # Production dependencies — patch updates only, grouped
      production-patch:
        dependency-type: "production"
        update-types:
          - "patch"

      # Production minor updates (separate so they get individual review)
      production-minor:
        dependency-type: "production"
        update-types:
          - "minor"

    # Automatically assign reviewers and labels
    assignees:
      - "your-github-username"

    labels:
      - "dependencies"
      - "rust"

    commit-message:
      prefix: "chore(deps)"
      include: "scope"

    # Rebase strategy: always rebase to keep the PR branch current
    rebase-strategy: "auto"

    # Allow major version bumps only for these packages (they use semver properly)
    allow:
      - dependency-type: "all"

    ignore:
      # Ignore major version bumps for these crates (manual review required)
      # Uncomment and adjust as needed:
      # - dependency-name: "tokio"
      #   update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"

    open-pull-requests-limit: 5

    groups:
      # Group all actions updates into a single PR per week
      github-actions:
        patterns:
          - "*"

    assignees:
      - "your-github-username"

    labels:
      - "dependencies"
      - "ci"

    commit-message:
      prefix: "ci"
      include: "scope"

    rebase-strategy: "auto"
