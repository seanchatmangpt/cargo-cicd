# =============================================================================
# docker-compose.yml — production compose configuration
# Usage: docker compose up -d
# Dev overrides are applied automatically from docker-compose.override.yml
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Pass build-time metadata as build args (populated by docker-build.sh)
      args:
        BUILD_DATE: "${BUILD_DATE:-}"
        GIT_COMMIT: "${GIT_COMMIT:-}"
        VERSION: "${VERSION:-latest}"
    image: cargo-project-serve:${VERSION:-latest}
    container_name: cargo-project-serve
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      APP_ENV: production
      DATABASE_URL: "${DATABASE_URL:-sqlite:///data/app.db}"
      # Add further secrets via .env or a secrets manager; never hard-code here.
    volumes:
      # Persistent storage for SQLite database
      - app-data:/data
    healthcheck:
      # The binary exposes --health-check for use inside distroless containers
      # (no curl available). If your binary does not implement this flag, switch
      # to an HTTP probe via a sidecar or use a -slim image that has wget/curl.
      test: ["/app/cargo-project-serve", "--health-check"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    # Drop all Linux capabilities; add back only what the app needs
    cap_drop:
      - ALL
    # Read-only filesystem except for named volumes
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Optional: Nginx reverse proxy
  # Uncomment to place Nginx in front of the app (useful for TLS termination,
  # rate limiting, and static asset serving).
  # ---------------------------------------------------------------------------
  # nginx:
  #   image: nginx:1.27-alpine
  #   container_name: cargo-project-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - nginx-certs:/etc/nginx/certs:ro
  #   depends_on:
  #     app:
  #       condition: service_healthy
  #   restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Optional: PostgreSQL (replace SQLite for multi-replica deployments)
  # ---------------------------------------------------------------------------
  # db:
  #   image: postgres:16-alpine
  #   container_name: cargo-project-db
  #   environment:
  #     POSTGRES_DB: "${POSTGRES_DB:-cargo_project}"
  #     POSTGRES_USER: "${POSTGRES_USER:-app}"
  #     POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
  #   volumes:
  #     - db-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   restart: unless-stopped

volumes:
  app-data:
    driver: local
  # db-data:
  #   driver: local
  # nginx-certs:
  #   driver: local

networks:
  default:
    name: cargo-project-net
