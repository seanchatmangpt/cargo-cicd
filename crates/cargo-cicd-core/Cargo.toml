[package]
name = "cargo-cicd-core"
version = "26.6.30"
edition = "2021"
rust-version = "1.86"
description = "Shared workspace/process-state domain for cargo-cicd tooling"
license = "MIT OR Apache-2.0"
repository = "https://github.com/seanchatmangpt/cargo-cicd"
homepage = "https://github.com/seanchatmangpt/cargo-cicd"
keywords = ["cargo", "ci", "workspace"]
categories = ["development-tools"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
walkdir = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
