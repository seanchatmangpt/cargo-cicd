[package]
name = "cargo-cicd-lsp"
version = "26.7.6"
edition = "2021"
rust-version = "1.86"
description = "Author-time LSP witness for cargo-cicd local software manufacturing state"
license = "MIT OR Apache-2.0"
repository = "https://github.com/seanchatmangpt/cargo-cicd"
homepage = "https://github.com/seanchatmangpt/cargo-cicd"
keywords = ["cargo", "ci", "lsp"]
categories = ["development-tools"]
include = ["src/**", "schemas/**", "Cargo.toml", "README.md"]

[[bin]]
name = "cargo-cicd-lsp"
path = "src/main.rs"

[lib]
name = "cargo_cicd_lsp"
path = "src/lib.rs"

[features]
default = []
editor-tests = []

[dependencies]
cargo-cicd-core = { workspace = true }
tower-lsp = "0.20"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
jsonschema = "0.28"
toml = "0.8"

[dev-dependencies]
tokio-test = "0.4"
