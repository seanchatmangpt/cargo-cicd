[package]
name = "cargo-cicd-lsp"
version = "26.6.2"
edition = "2021"
rust-version = "1.85"
description = "Author-time LSP witness for cargo-cicd local software manufacturing state"
license = "MIT OR Apache-2.0"

[[bin]]
name = "cargo-cicd-lsp"
path = "src/main.rs"

[lib]
name = "cargo_cicd_lsp"
path = "src/lib.rs"

[features]
default = []
editor-tests = []

[dependencies]
cargo-cicd-core = { path = "../cargo-cicd-core" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1"

[dev-dependencies]
tokio-test = "0.4"
