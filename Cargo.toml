[workspace]
members = [
  ".",
  "crates/cargo-cicd-core",
  "crates/cargo-cicd-lsp",
]
resolver = "2"

[workspace.dependencies]
# Shared dep versions — sub-crates reference these with `{ workspace = true }`
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
# Dev deps
assert_cmd = "2"
predicates = "3"
tempfile = "3"
# Internal crates
cargo-cicd-core = { path = "crates/cargo-cicd-core" }
cargo-cicd-lsp = { path = "crates/cargo-cicd-lsp" }
# External git crates
lsp-max-anti-cheat = { git = "https://github.com/seanchatmangpt/lsp-max", branch = "master" }

[package]
name = "cargo-cicd"
version = "26.6.2"
edition = "2021"
rust-version = "1.86"
description = "Local-first CI/CD helper for Rust workspaces: clean target dirs, run changed tests, check git state, and publish cicd.toml."
license = "MIT OR Apache-2.0"
repository = "https://github.com/seanchatmangpt/cargo-cicd"
homepage = "https://github.com/seanchatmangpt/cargo-cicd"
readme = "README.md"
keywords = ["cargo", "ci", "testing", "workspace", "cleanup"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
  "/receipts",
  "/docs/testing",
  "/docs/release",
  "/docs/deferred",
  "/docs/wasm4pm",
  "/ontology",
  "/queries",
  "/templates",
  "/cicd.toml",
  "/CLAUDE.md",
  "/ggen.toml",
  "/tests/wasm4pm_evidence",
]

[[bin]]
name = "cargo-cicd"
path = "src/main.rs"

[[bin]]
name = "cicd-evidence-gen"
path = "src/bin/cicd-evidence-gen.rs"

[features]
default = []
process-data = []
autonomic = ["process-data"]
autoarch = ["autonomic"]
contrib = ["process-data"]
wasm4pm = ["process-data"]  # capability scan complete; integration deferred to v26.6.3
anti-llm-cheat = ["dep:lsp-max-anti-cheat"]
lsp = []
# Cryptographic provenance receipts via the affidavit `affi` CLI (shell-out
# oracle, mirroring wasm4pm). affidavit itself is a nightly-only crate, so it is
# integrated as an external binary — never linked — to keep this build on stable.
affidavit = ["process-data"]
advanced = [
  "process-data",
  "dep:ignore",
  "dep:rayon",
  "dep:blake3",
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:miette",
  "dep:thiserror",
  "dep:moka",
  "dep:bitcode",
  "dep:petgraph",
  "dep:jiff",
  "dep:hdrhistogram",
  "dep:aho-corasick",
]

[dependencies]
cargo-cicd-core = { workspace = true }
cargo-cicd-lsp = { workspace = true }
clap = { version = "4", features = ["derive"] }
clap-noun-verb = "26.6.2"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
walkdir = { workspace = true }

# --- advanced capabilities (best-of-breed / bleeding-edge), gated behind `advanced` ---
ignore = { version = "0.4", optional = true }
rayon = { version = "1", optional = true }
blake3 = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["fmt", "env-filter", "json"] }
miette = { version = "7", optional = true, features = ["fancy"] }
thiserror = { version = "2", optional = true }
moka = { version = "0.12", optional = true, features = ["sync"] }
bitcode = { version = "0.6", optional = true, features = ["serde"] }
petgraph = { version = "0.6", optional = true }
jiff = { version = "0.2", optional = true, features = ["serde"] }
hdrhistogram = { version = "7", optional = true }
aho-corasick = { version = "1", optional = true }
lsp-max-anti-cheat = { workspace = true, optional = true }

[[example]]
name = "01_first_clean"
path = "examples/01_first_clean.rs"

[[example]]
name = "02_ocel_evidence"
path = "examples/02_ocel_evidence.rs"

[[example]]
name = "03_max_pipeline"
path = "examples/03_max_pipeline.rs"
