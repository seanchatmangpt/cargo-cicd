[package]
name = "cargo-cicd"
version = "26.6.2"
edition = "2021"
description = "Local-first CI/CD helpers for Rust workspaces: clean target dirs, run changed tests, check git state, and publish cicd.toml."
authors = ["Sean Chatman <sean@chatmangpt.com>"]
license = "MIT"
repository = "https://github.com/seanchatmangpt/cargo-cicd"
readme = "README.md"
keywords = ["cargo", "cicd", "workspace", "testing", "git"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "cargo-cicd"
path = "src/main.rs"

[features]
default = []
process-data = []
autonomic = ["process-data"]
contrib = ["process-data"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env", "suggestions"] }
clap-noun-verb = { path = "/Users/sac/clap-noun-verb" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }
which = "6"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
