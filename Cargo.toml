[package]
name = "cargo-cicd"
version = "26.6.2"
edition = "2021"
rust-version = "1.74"
description = "Local-first CI/CD helpers for Rust workspaces: clean target dirs, run changed tests, check git state, and publish cicd.toml."
license = "MIT OR Apache-2.0"

[[bin]]
name = "cargo-cicd"
path = "src/main.rs"

[features]
default = []
process-data = []
autonomic = ["process-data"]
contrib = ["process-data"]
wasm4pm = ["process-data"]  # capability scan complete; integration deferred to v26.6.3

[dependencies]
clap = { version = "4", features = ["derive"] }
clap-noun-verb = { path = "/Users/sac/clap-noun-verb" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
walkdir = "2"
serde_json = "1"

[[test]]
name = "feature_projection"
path = "tests/feature_projection.rs"

[[test]]
name = "cli"
harness = true
path = "tests/cli/command_projection.rs"

[[test]]
name = "cicd_toml_truth"
path = "tests/cicd_toml_truth.rs"

[[test]]
name = "autonomic_policies"
path = "tests/autonomic_policies.rs"

[[test]]
name = "changed_tests"
path = "tests/changed_tests.rs"

[[test]]
name = "git_phase_closure"
path = "tests/git_phase_closure.rs"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
predicates = "3"
toml = "0.8"
