[project]
name = "cargo-cicd"
version = "26.6.2"
description = "Manufacturing surface for cargo-cicd — CI/CD helper for Rust workspaces"

[ontology]
source = "ontology/cargo-cicd.ttl"
standard_only = false

[generation]
output_dir = "."

[inference]
rules = [
    { name = "command-projection", construct = "CONSTRUCT { ?s ?p ?o } WHERE { ?s ?p ?o }" }
]

[[rules]]
name = "noun-modules"
query = "queries/commands.rq"
template = "templates/noun.rs.tera"
output = "src/nouns/{{noun_name}}.rs"

[[rules]]
name = "command-docs"
query = "queries/commands.rq"
template = "templates/command_doc.md.tera"
output = "docs/commands/{{noun_name}}.md"

[[rules]]
name = "cli-tests"
query = "queries/commands.rq"
template = "templates/cli_test.rs.tera"
output = "tests/cli/test_{{noun_name}}.rs"
