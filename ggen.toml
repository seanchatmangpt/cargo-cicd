[project]
name = "cargo-cicd"
version = "26.10.10"
description = "Manufacturing surface for cargo-cicd — CI/CD helper for Rust workspaces"

[ontology]
source = "ontology/public/cargo-cicd-capabilities.ttl"
imports = ["../ggen/packs/ggen-release-pack/ontology.ttl"]
base_iri = "https://cargo-cicd.rs/ontology/"

[ontology.prefixes]
cc      = "https://cargo-cicd.rs/ontology/"
skos    = "http://www.w3.org/2004/02/skos/core#"
dcterms = "http://purl.org/dc/terms/"
prov    = "http://www.w3.org/ns/prov#"
xsd     = "http://www.w3.org/2001/XMLSchema#"
rdf     = "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
rdfs    = "http://www.w3.org/2000/01/rdf-schema#"

[[packs]]
name = "ggen-release-pack"
registry = "local"
path = "../ggen/packs/ggen-release-pack"

[inference]

[[inference.rules]]
name = "capability-projection"
construct = """
PREFIX cc:      <https://cargo-cicd.rs/ontology/>
PREFIX dcterms: <http://purl.org/dc/terms/>
PREFIX skos:    <http://www.w3.org/2004/02/skos/core#>
CONSTRUCT {
  ?cap a cc:Capability ;
       cc:cliCommand ?cli_command ;
       cc:noun ?noun ;
       cc:verb ?verb ;
       dcterms:description ?description .
}
WHERE {
  ?cap a skos:Concept ;
       cc:cliCommand ?cli_command ;
       cc:noun ?noun ;
       cc:verb ?verb ;
       dcterms:description ?description .
}
ORDER BY ?noun ?verb
"""

[generation]
output_dir = "."

[[generation.rules]]
name = "readme"
query = { inline = """
PREFIX cc:      <https://cargo-cicd.rs/ontology/>
PREFIX dcterms: <http://purl.org/dc/terms/>
SELECT ?cli_command ?noun ?verb ?description
WHERE {
  ?cap a cc:Capability ;
       cc:cliCommand ?cli_command ;
       cc:noun ?noun ;
       cc:verb ?verb ;
       dcterms:description ?description .
}
ORDER BY ?noun ?verb
""" }
template = { file = "templates/README.md.tera" }
output_file = "README.md"
mode = "Overwrite"

[[generation.rules]]
name = "reference-status"
query = { inline = """
PREFIX cc:      <https://cargo-cicd.rs/ontology/>
PREFIX dcterms: <http://purl.org/dc/terms/>
SELECT ?cli_command ?noun ?verb ?description
WHERE {
  ?cap a cc:Capability ;
       cc:noun ?noun ;
       cc:verb ?verb ;
       cc:cliCommand ?cli_command ;
       dcterms:description ?description .
  FILTER(?noun = "status")
}
ORDER BY ?noun ?verb
""" }
template = { file = "templates/docs/reference-command.md.tera" }
