      "timestamp": "2026-06-14T22:51:00Z",
      "workspace": "cargo-cicd",
      "audit_type": "governance-compliance",
      "violations": [
        {
          "severity": "error",
          "code": "cargo_cicd::target_pressure",
          "path": "target/debug/build",
          "matched_patterns": ["target"],
          "message": "target/ exceeds budget: 25.0 GiB vs 20.0 GiB limit",
          "recommendation": "Run cargo make clean or increase [target].max_size_gb in cicd.toml"
        }
      ],
      "fingerprint_snapshot": {
        "workspace_artifacts": "a7f3d9e2c1b8f4a6...",
        "changed_since_last": ["target/debug/deps/..."],
        "suspicious_artifacts": []
      },
      "policy_verdicts": [
        {
          "policy": "target-pressure",
          "mode": "suggest",
          "verdict": "warn",
          "signals": ["size_mb: 25600"],
          "recommendation": "address 1 signal(s): prune artifacts"
        }
      ],
      "summary": {
        "total_violations": 1,
        "error_count": 1,
        "warning_count": 1,
        "passed_policies": 5,
        "compliance_score": "83%"
      }
