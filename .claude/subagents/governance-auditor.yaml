      ┌─ cicd.toml:42:20
      │
       42 │   max_size_gb = 20
      │   ───────────────── declared here
      │
      help: run a cleanup pass or raise `[target].max_size_gb` in cicd.toml

    ─────────────────────────────────────────────────────────────────────────

example_prompts:
  - |
    "Scan the current workspace for files matching the deny-list [target, node_modules, .git].
     Report which changed files violate these patterns. Suggest remediation."

  - |
    "Compute a fingerprint snapshot of all artifacts in target/. Compare against the
     last known hash (if cicd.toml has a cached snapshot). Flag any suspicious changes."

  - |
    "Validate cicd.toml against the governance schema. Check for:
     (1) missing [state] section
     (2) [target].max_size_gb vs actual target/ size
     (3) toolchain mismatch
     Render violations with miette diagnostics."

  - |
    "Generate a policy compliance report. Evaluate these policies:
     - target_pressure (size check)
     - toolchain_mismatch (pinned vs active)
     - git_phase_dirty (uncommitted changes)
     - trybuild_changed (fixture modifications)
     Output JSON audit report with severity and recommendations."

  - |
    "Detect policy violations in the workspace and render each as a rich diagnostic
     with source spans pointing to cicd.toml offending regions. Include help text
     and remediation steps for each violation."

required_feature_flags:
  - advanced: "Pattern matching, fingerprinting, and rich diagnostics all require the `advanced` feature"
  - optional_autonomic: "Optional; if enabled, policy_engine can emit Policy verdicts for recommend mode"

design_rationale: |
  The governance-auditor specializes in read-only validation and pattern-based compliance checks.
  It leverages cargo-cicd's internal architecture:

  1. **Pattern Matching via Aho-Corasick**: Efficient single-pass scanning for deny-list violations
     without hard-coded vocabulary. Patterns are always runtime-supplied by the caller (policy owner).

  2. **Fingerprint-Based Auditing**: Content-addressed hashing (BLAKE3) enables snapshot comparison
     and detection of unauthorized artifact mutations. Workspace digests are deterministic and
     order-independent, making them suitable for caching and comparison across runs.

  3. **Rich Diagnostics with miette**: Policy violations are rendered as graphical reports with
     source spans pointing to offending cicd.toml sections. Each diagnostic includes a stable code,
     severity, and remediation guidance. No silent failures; all issues are clearly communicated.

  4. **Policy State as First-Class**: PolicyState (verdict + recommendation) is structured and
     serializable, enabling integration with CI/CD systems, audit logs, and downstream automation.

  5. **Read-Only Enforcement**: The auditor can suggest fixes but never apply them. This prevents
     side effects and keeps the auditor suitable for CI/CD gates, linting passes, and non-blocking reports.

