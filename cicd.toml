[workspace]
name = "cargo-cicd"
toolchain = "stable-aarch64-apple-darwin"
target_dir = "target"

[state]
dirty = true
target_size_gb = 1.95
changed_files = 243
changed_tests = 93
changed_trybuild_fixtures = 61

[target]
max_size_gb = 20
prune_after_days = 14

[test.changed]
enabled = true
base = "origin/main"

[trybuild.changed]
enabled = true
snapshot_mode = "changed-only"

[git.phase]
require_clean_tree = true
commit_after_phase = false

[autonomic]
enabled = true
mode = "suggest"

[[events]]
kind = "status"
verdict = "pass"
