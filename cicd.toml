[workspace]
name = "cargo-cicd"
toolchain = "stable-x86_64-unknown-linux-gnu"
target_dir = "target"

[state]
dirty = true
target_size_gb = 10.24
changed_files = 215
changed_tests = 90
changed_trybuild_fixtures = 61

[target]
max_size_gb = 20
prune_after_days = 14

[test.changed]
enabled = true
base = "origin/main"

[trybuild.changed]
enabled = true
snapshot_mode = "changed-only"

[git.phase]
require_clean_tree = true
commit_after_phase = false

[autonomic]
enabled = true
mode = "suggest"

[[events]]
kind = "status"
verdict = "pass"
